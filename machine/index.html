<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onur Can Mığırdağı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --chassis:#E9EAEE; --deck:#FFFFFF; --panel:#FFFFFF; --panel2:#F5F6F8;
  --line:rgba(24,26,32,.10); --line2:rgba(24,26,32,.15); --line3:rgba(24,26,32,.26);
  --txt:#22242A; --dim:#5D616A; --faint:#93979E;
  --sig:#FF9A3C; --sig-ink:#B9640A; --sig-dim:#D69355; --sig-soft:rgba(255,154,60,.15);
  --shadow:rgba(26,30,38,.22);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:Archivo,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0; height:100%; overflow:hidden;}
body{
  background:var(--chassis); color:var(--txt); font-family:var(--ui); font-size:15px;
  -webkit-font-smoothing:antialiased; user-select:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
::selection{background:var(--sig); color:#1A1206;}

/* ============ boot ============ */
#boot{position:fixed; inset:0; z-index:100; background:var(--deck);
  display:grid; place-items:center; font-family:var(--mono);}
#boot .lines{width:min(360px,84vw); font-size:12.5px; line-height:2.1; color:var(--dim);}
#boot .lines b{color:var(--sig-ink); font-weight:500;}
#boot .lines div{opacity:0;}
#boot .lines div.on{opacity:1;}
#boot .cur{display:inline-block; width:8px; height:15px; background:var(--sig);
  vertical-align:-2px; animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
#boot.gone{opacity:0; pointer-events:none; transition:opacity .34s ease;}
#boot .skip{position:absolute; bottom:22px; left:0; right:0; text-align:center;
  font-size:10.5px; letter-spacing:.18em; color:var(--faint);}

/* ============ shell ============ */
#os{position:fixed; inset:0; display:flex; flex-direction:column; opacity:0;}
#os.up{opacity:1; transition:opacity .3s ease;}

#top{flex:none; height:30px; display:flex; align-items:center; gap:16px;
  padding:0 14px; background:var(--deck); border-bottom:1px solid var(--line);
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; color:var(--dim);}
#top .brand{color:var(--txt); font-weight:700; letter-spacing:.22em;}
#top .brand i{font-style:normal; color:var(--sig-ink);}
#top .right{margin-left:auto; display:flex; align-items:center; gap:12px;}
#top .led{width:6px; height:6px; border-radius:50%; background:var(--sig);
  box-shadow:0 0 7px var(--sig);}
#top button{font-family:var(--mono); font-size:11px; letter-spacing:.09em; color:var(--dim);
  padding:3px 8px; border-radius:4px;}
#top button:hover{color:var(--txt); background:rgba(24,26,32,.05);}
#lgbtn{display:flex; gap:7px;}
#lgbtn i{font-style:normal; opacity:.5;}
#lgbtn i.on{opacity:1; color:var(--sig-ink); font-weight:700;}

#desk{position:relative; flex:1 1 auto; overflow:hidden;
  background:
    radial-gradient(86% 60% at 15% -10%, rgba(255,255,255,.42) 0%, transparent 58%),
    radial-gradient(74% 56% at 100% 108%, rgba(96,101,112,.14) 0%, transparent 58%),
    linear-gradient(168deg,#E4E6EA 0%, #D8DBE1 46%, #CCD0D6 100%);}
#grid{position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(24,26,32,.038) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,26,32,.038) 1px, transparent 1px);
  background-size:26px 26px;}

/* ============ orbital system ============ */
#sky{position:absolute; inset:0; z-index:0; pointer-events:none;}
#sky svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block;}
#sky circle.ra{fill:none; stroke:rgba(30,34,42,.24); stroke-width:1; stroke-dasharray:2 10;}
#sky .cl{fill:none; stroke:rgba(38,42,50,.40); stroke-width:1; stroke-linecap:round;
  stroke-linejoin:round;}
#sky .cd{stroke:none; fill:rgba(38,42,50,.5); animation:tw 3.6s ease-in-out infinite;}
#sky .cd:nth-of-type(2){animation-duration:5.1s; animation-delay:.9s;}
#sky .cd:nth-of-type(3){animation-duration:4.2s; animation-delay:1.7s;}
@keyframes tw{0%,100%{opacity:.45} 50%{opacity:1}}
#sky text{font-family:var(--mono); text-anchor:middle;}
#sky text.ct{font-size:10px; letter-spacing:.28em; fill:#3D424A;
  opacity:0; transition:opacity .3s ease;}
#sky.near text.ct{opacity:1;}
body.phone #sky text.ct{opacity:1;}

.planet{position:absolute; left:-999px; top:0; z-index:3; pointer-events:auto;
  cursor:pointer; touch-action:none; transition:transform .36s cubic-bezier(.2,1,.3,1);}
.planet:hover{transform:scale(1.035);}
#coreA{width:176px; height:176px;}
.planet svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block;}
.planet .rg{fill:none; stroke:var(--sig); stroke-width:2; opacity:.78;}
.planet .rf{fill:none; stroke:var(--sig); stroke-width:2.1; opacity:.9;
  filter:drop-shadow(0 1px 2px rgba(26,30,38,.28));}
.planet .rg2{stroke-width:1.1; opacity:.4; stroke-dasharray:3 7;
  animation:drift 60s linear infinite;}
@keyframes drift{to{stroke-dashoffset:-200;}}
.planet .halo{position:absolute; left:50%; top:50%; width:86%; height:86%;
  transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,154,60,.17) 0%, rgba(255,154,60,0) 66%);
  animation:rim 5.5s ease-in-out infinite;}
@keyframes rim{0%,100%{opacity:.55} 50%{opacity:1}}
.planet .orb{position:absolute; left:50%; top:50%; width:59%; height:59%;
  margin-left:-29.5%; margin-top:-29.5%; border-radius:50%;
  display:grid; place-items:center; pointer-events:none;
  background:radial-gradient(circle at 31% 25%, #FFFFFF 0%, #F4F5F8 44%, #D6DAE1 100%);
  box-shadow:0 16px 32px rgba(26,30,38,.22), inset 0 0 0 1px rgba(255,255,255,.95),
             inset -10px -12px 26px rgba(20,22,28,.13);}
.planet .cap{font-family:var(--mono); color:#3B3E45; display:block;
  font-size:10.5px; letter-spacing:.24em;}
.planet .lbl{position:absolute; left:-24px; right:-24px; bottom:-3px; text-align:center;
  font-family:var(--mono); font-size:9px; letter-spacing:.24em; color:var(--sig-ink);
  opacity:0; transition:opacity .26s ease;}
.planet:hover .lbl{opacity:1;}

/* ============ context menu ============ */
#menu{position:fixed; z-index:75; min-width:208px; padding:5px; display:none;
  background:var(--panel); border:1px solid var(--line2); border-radius:8px;
  box-shadow:0 20px 48px rgba(26,30,38,.24); font-family:var(--mono); font-size:11.5px;}
#menu.on{display:block; animation:mpop .13s cubic-bezier(.2,1,.3,1) both;}
@keyframes mpop{from{opacity:0; transform:translateY(-5px) scale(.97)} to{opacity:1; transform:none}}
#menu button{display:flex; width:100%; align-items:center; gap:16px; padding:7px 10px;
  border-radius:5px; color:var(--dim); letter-spacing:.05em; text-align:left;}
#menu button:hover{background:var(--sig-soft); color:var(--sig-ink);}
#menu button s{margin-left:auto; text-decoration:none; color:var(--faint); font-size:10px;}
#menu button:hover s{color:var(--sig-ink); opacity:.7;}
#menu hr{border:none; border-top:1px solid var(--line); margin:5px 8px;}

/* ============ desktop icons ============ */
#icons{position:absolute; inset:0; z-index:1; pointer-events:none;}
.ico{position:absolute; left:0; top:0; width:104px; pointer-events:auto; touch-action:none;
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 4px 8px;
  border-radius:8px; border:1px solid transparent; cursor:grab; text-align:center;
  will-change:transform;}
.ico.moving{cursor:grabbing;}
.ico.moving .tile{box-shadow:0 14px 26px rgba(26,30,38,.30), 0 0 0 2px rgba(255,154,60,.55);}
.ico.ret .tile{box-shadow:0 9px 20px rgba(26,30,38,.24), 0 0 0 2px rgba(255,154,60,.34);}
.ico:hover{background:rgba(255,255,255,.62);}
.ico.sel{background:rgba(255,255,255,.82); border-color:rgba(255,154,60,.55);}
.ico .tile{width:40px; height:40px; border-radius:11px; background:var(--deck);
  border:1px solid rgba(24,26,32,.09); box-shadow:0 4px 12px rgba(26,30,38,.20);
  display:grid; place-items:center;}
.ico.sel .tile{border-color:var(--sig);}
.ico svg{width:23px; height:23px; display:block;}
.ico .g{fill:none; stroke:#F0800C; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.ico .gf{fill:#F0800C; stroke:none;}
.ico span{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; color:#33363C;
  line-height:1.3; word-break:break-word; text-shadow:0 1px 0 rgba(255,255,255,.7);}
.ico.sel span{color:var(--txt);}

/* ============ windows ============ */
#wins{position:absolute; inset:0;}
.win{position:absolute; display:flex; flex-direction:column; background:var(--panel);
  border:1px solid var(--line2); border-radius:9px; overflow:hidden;
  box-shadow:0 12px 34px rgba(26,30,38,.20); min-width:300px; min-height:180px;}
.win.on{border-color:var(--line2); box-shadow:0 22px 56px rgba(26,30,38,.28), 0 0 0 1px rgba(255,154,60,.42);}
.win.pop{animation:wpop .17s cubic-bezier(.2,.9,.3,1) both;}
@keyframes wpop{from{opacity:0; transform:scale(.965);} to{opacity:1; transform:none;}}
.win.min{animation:wmin .18s ease forwards;}
@keyframes wmin{to{opacity:0; transform:scale(.9) translateY(28px);}}
.tbar{flex:none; height:31px; display:flex; align-items:center; gap:9px; padding:0 6px 0 11px;
  background:var(--panel2); border-bottom:1px solid var(--line); cursor:default;}
.tbar .nm{font-family:var(--mono); font-size:11.5px; letter-spacing:.07em; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.win.on .tbar .nm{color:var(--sig-ink);}
.tbar .sp{flex:1 1 auto; min-width:8px;}
.tbar .ctl{display:flex; gap:1px;}
.tbar .ctl button{width:26px; height:22px; border-radius:4px; font-family:var(--mono);
  font-size:12px; color:var(--faint); line-height:1;}
.tbar .ctl button:hover{color:var(--txt); background:rgba(24,26,32,.07);}
.tbar .ctl button.x:hover{color:#fff; background:var(--sig);}
.body{flex:1 1 auto; overflow:auto; overscroll-behavior:contain; user-select:text;}
.rz{position:absolute; z-index:3;}
.rz.e{top:0; right:0; width:6px; height:100%; cursor:ew-resize;}
.rz.s{left:0; bottom:0; height:6px; width:100%; cursor:ns-resize;}
.rz.se{right:0; bottom:0; width:15px; height:15px; cursor:nwse-resize;}
.rz.se::after{content:""; position:absolute; right:3px; bottom:3px; width:7px; height:7px;
  border-right:1.5px solid var(--line3); border-bottom:1.5px solid var(--line3);}
#ghost{position:absolute; border:1px solid var(--sig); background:var(--sig-soft);
  border-radius:9px; pointer-events:none; opacity:0; transition:opacity .12s ease; z-index:2;}
#ghost.on{opacity:1;}

.body::-webkit-scrollbar{width:9px; height:9px;}
.body::-webkit-scrollbar-track{background:transparent;}
.body::-webkit-scrollbar-thumb{background:rgba(24,26,32,.16); border-radius:9px;}
.body::-webkit-scrollbar-thumb:hover{background:rgba(24,26,32,.28);}

/* ============ taskbar ============ */
#bar{flex:none; height:34px; display:flex; align-items:center; gap:7px; padding:0 10px;
  background:var(--deck); border-top:1px solid var(--line); font-family:var(--mono); font-size:11px;}
#bar .k{padding:5px 9px; border-radius:5px; color:var(--dim); letter-spacing:.07em;
  border:1px solid transparent; white-space:nowrap; display:flex; align-items:center; gap:7px;
  text-decoration:none;}
#bar .lnk svg{width:13px; height:13px; fill:currentColor; display:block;}
#bar .lnk:hover{color:var(--sig-ink); background:var(--sig-soft);}
#bar .lnk{border-left:1px solid var(--line); border-radius:0 5px 5px 0; padding-left:12px;
  margin-left:3px;}
#bar .k:hover{color:var(--txt); background:rgba(24,26,32,.05);}
#tasks{display:flex; gap:5px; align-items:center; overflow:hidden; flex:1 1 auto;}
.tk{display:flex; align-items:center; gap:7px; padding:5px 10px; border-radius:5px;
  border:1px solid var(--line); color:var(--dim); letter-spacing:.06em; max-width:190px;}
.tk:hover{color:var(--txt); background:rgba(24,26,32,.05);}
.tk.on{color:var(--sig-ink); border-color:rgba(255,154,60,.55); background:var(--sig-soft);}
.tk i{width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; opacity:.7;}
.tk span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#clock{margin-left:auto; color:var(--dim); letter-spacing:.1em; font-variant-numeric:tabular-nums;
  padding-left:10px; border-left:1px solid var(--line);}

/* ============ command palette ============ */
#pal{position:fixed; inset:0; z-index:60; background:rgba(44,48,56,.30);
  display:grid; place-items:start center; padding-top:13vh; opacity:0; pointer-events:none;
  transition:opacity .16s ease;}
#pal.on{opacity:1; pointer-events:auto;}
#palbox{width:min(520px,92vw); background:var(--panel); border:1px solid var(--line2);
  border-radius:10px; box-shadow:0 26px 62px rgba(26,30,38,.30); overflow:hidden;
  transform:translateY(-8px) scale(.985); transition:transform .18s cubic-bezier(.2,1,.35,1);}
#pal.on #palbox{transform:none;}
#palin{width:100%; padding:14px 16px; background:none; border:none; outline:none;
  font-family:var(--mono); font-size:13.5px; color:var(--txt); letter-spacing:.04em;
  border-bottom:1px solid var(--line);}
#palin::placeholder{color:var(--faint);}
#pallist{max-height:44vh; overflow:auto; padding:6px;}
#pallist div{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:6px;
  font-family:var(--mono); font-size:12px; color:var(--dim); cursor:pointer; letter-spacing:.05em;}
#pallist div em{font-style:normal; margin-left:auto; color:var(--faint); font-size:10px;}
#pallist div.cur{background:var(--sig-soft); color:var(--sig-ink);}
#pallist div.cur em{color:var(--sig-ink); opacity:.65;}

/* ============ window content ============ */
.doc{padding:22px 26px 28px; max-width:none;}
.doc.mono{font-family:var(--mono); font-size:12.5px; line-height:1.85; color:var(--dim);}
.doc.mono b{color:var(--txt); font-weight:500;}
.doc.mono .hr{height:1px; background:var(--line); margin:16px 0;}
.doc.mono a{color:var(--sig-ink); text-decoration:none; border-bottom:1px solid rgba(185,100,10,.35);}
.doc h1{font-family:var(--ui); font-size:23px; font-weight:700; letter-spacing:-.01em;
  margin:0 0 4px; color:var(--txt);}
.doc .meta{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.08em;
  margin:0 0 16px;}
.doc .lede{font-size:15.5px; color:var(--dim); margin:0 0 20px; max-width:62ch; line-height:1.6;}
.doc p{margin:0 0 13px; max-width:66ch; line-height:1.68; color:var(--dim);}
.doc .rail{margin:20px 0 0; border:1px solid var(--line); border-radius:8px; padding:15px 16px;
  background:rgba(24,26,32,.032);}
.doc .rail h3{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--faint); margin:0 0 11px; font-weight:500;}
.doc .rail ol{margin:0; padding:0; list-style:none; counter-reset:s;}
.doc .rail li{font-family:var(--mono); font-size:11.5px; line-height:1.6; color:var(--dim);
  padding:0 0 6px 26px; position:relative; counter-increment:s;}
.doc .rail li::before{content:counter(s,decimal-leading-zero); position:absolute; left:0;
  color:var(--sig-ink); font-size:10px; opacity:.6;}
.doc .rail li b{color:var(--sig-ink); font-weight:500;}
.doc .tags{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 0;}
.doc .tags span{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--dim);
  border:1px solid var(--line); border-radius:5px; padding:4px 8px;}
.doc .badges{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 18px;}
.doc .badges span{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:5px; padding:5px 9px; color:var(--faint);}
.doc .badges span.on{color:var(--sig-ink); border-color:rgba(255,154,60,.55); background:var(--sig-soft);}
/* project diagrams: drawn from data, coloured only through the theme tokens
   so the night build needs nothing of its own */
.doc .dia{margin:0 0 22px; border:1px solid var(--line); border-radius:8px;
  padding:14px 14px 12px; background:var(--panel2); overflow-x:auto;}
.doc .dia h3{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--faint); margin:0 0 10px; font-weight:500;}
.dia svg{display:block; width:100%; min-width:470px; height:auto; overflow:visible;}
.dia .dn{fill:var(--panel); stroke:var(--line3); stroke-width:1;}
.dia .dn.hi{stroke:var(--sig); stroke-width:1.3;}
.dia .dn.nt{fill:none; stroke-dasharray:3 4;}
.dia .grp{fill:none; stroke:var(--line2); stroke-dasharray:5 5;}
.dia text{font-family:var(--mono); font-size:11px; fill:var(--dim); text-anchor:middle;}
.dia text.dt{fill:var(--txt); font-weight:500;}
.dia text.hi{fill:var(--sig-ink);}
.dia text.el,.dia text.gt{font-size:10px; fill:var(--faint); letter-spacing:.06em;}
.dia .de{fill:none; stroke:var(--sig-dim); stroke-width:1.3; stroke-dasharray:4 4;
  animation:flow 1.4s linear infinite;}
.dia .ah{fill:var(--sig-dim);}
@keyframes flow{to{stroke-dashoffset:-16;}}
/* the İş Takip demo keeps the app's own dark palette in both themes, the way
   a screenshot would, so it reads as the program rather than as the page */
.pk{margin:0 0 24px; border-radius:12px; overflow:hidden; background:#0B0B0F; border:1px solid #2A2A36;
  color:#E8E8EE; font-family:var(--ui); box-shadow:0 14px 34px rgba(10,10,22,.28); user-select:none;}
.pk-top{display:flex; align-items:center; gap:10px; padding:7px 10px; background:#15151B; border-bottom:1px solid #2A2A36;}
.pk-dots{display:flex; gap:6px;} .pk-dots i{width:9px; height:9px; border-radius:50%; background:#2A2A36;}
.pk-tabs{display:flex; gap:3px; margin-left:4px;}
.pk-tabs button{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:#8A8A99; padding:5px 11px; border-radius:6px;}
.pk-tabs button:hover{color:#E8E8EE;}
.pk-tabs button.on{color:#E8E8EE; background:#1E1E26; box-shadow:inset 0 0 0 1px #2A2A36;}
.pk-stat{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:#8A8A99; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pk-view{display:none;} .pk-view.on{display:block;}
.pk-stage{position:relative; height:460px; overflow:hidden;}
.pk-stage canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab;}
.pk-stage canvas.grab{cursor:grabbing;}
.pk-ctl{position:absolute; left:10px; top:10px; display:flex; flex-direction:column; gap:4px;}
.pk-ctl button{width:27px; height:27px; border-radius:7px; background:rgba(21,21,27,.9); border:1px solid #2A2A36;
  color:#A9A9B8; font-family:var(--mono); font-size:13px; line-height:1;}
.pk-ctl button:hover{color:#fff; border-color:#7C5CFF;}
.pk-side.on ~ .pk-hint{display:none;}
.pk-hint{position:absolute; left:12px; bottom:9px; font-family:var(--mono); font-size:10px; color:#5E5E6C; pointer-events:none;}
.pk-tip{position:absolute; pointer-events:none; background:rgba(21,21,27,.96); border:1px solid #2A2A36; border-radius:7px;
  padding:6px 9px; font-size:12px; max-width:240px; opacity:0; transition:opacity .12s ease; color:#E8E8EE;}
.pk-tip small{display:block; font-family:var(--mono); font-size:10px; color:#8A8A99; margin-top:2px;}
.pk-side{position:absolute; top:10px; right:10px; bottom:10px; width:272px; background:rgba(17,17,23,.95);
  border:1px solid #2A2A36; border-radius:10px; padding:14px 14px 12px; overflow:auto; opacity:0; transform:translateX(14px);
  pointer-events:none; transition:opacity .2s ease, transform .2s ease; user-select:text;}
.pk-side.on{opacity:1; transform:none; pointer-events:auto;}
.pk-x{position:absolute; right:8px; top:6px; color:#8A8A99; font-size:17px; width:24px; height:24px;}
.pk-x:hover{color:#fff;}
.pk-kind{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px; color:#A9A9B8; text-transform:uppercase; letter-spacing:.1em;}
.pk-kind i{width:8px; height:8px; border-radius:50%;}
.pk-st{margin-left:6px; text-transform:none; letter-spacing:.02em;}
.pk-title{font-size:16px; font-weight:600; margin:7px 0 4px; line-height:1.3; color:#fff; padding-right:14px;}
.pk-meta{font-family:var(--mono); font-size:10.5px; color:#8A8A99; margin:0 0 10px;}
.pk-side ul{list-style:none; margin:0 0 10px; padding:0;}
.pk-side li{padding:6px 7px; border-radius:6px; cursor:pointer; font-size:12.5px; line-height:1.35;}

.pk-mk:hover{background:#6D4FE8;}
.pk-leg{display:flex; flex-wrap:wrap; gap:6px; padding:9px 10px; border-top:1px solid #2A2A36; background:#101015;}

.pk-leg button em{font-style:normal; color:#6E6E7C;}
.pk-leg button.off{opacity:.35;}
.pk-pbar{display:flex; align-items:center; gap:14px; padding:12px 14px; border-bottom:1px solid #2A2A36; background:#101015;

.pk-opts button{text-align:left; padding:10px 12px; border-radius:8px; background:#15151B; border:1px solid #2A2A36;

.pk-opts button.ok{border-color:#4ADE80; background:rgba(74,222,128,.10);}
.pk-opts button.no{border-color:#F87171; background:rgba(248,113,113,.10);}

.pk-res{padding:13px 15px; border-radius:10px; background:#15151B; border:1px solid #2A2A36; display:grid; gap:8px; margin-bottom:10px;}
.pk-edge{font-size:14px;} .pk-edge em{font-style:normal; font-family:var(--mono); font-size:12px; margin:0 6px;}
.pk-rate{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;}
.pk-rate.r1{color:#F87171;} .pk-rate.r2{color:#FBBF24;} .pk-rate.r3{color:#4ADE80;}
.pk-fsrs{font-family:var(--mono); font-size:11.5px; color:#A9A9B8;}
.pk-next{justify-self:start; padding:8px 14px; border-radius:7px; background:#7C5CFF; color:#fff; font-size:12px; font-weight:600;}
.pk-gfoot{margin-top:auto; display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:#6E6E7C; line-height:1.5; padding-top:8px;}
.pk-gfoot span:first-child{font-family:var(--mono); color:#8A8A99;}
body.mob .pk-stage,body.phone .pk-stage{height:380px;}
body.mob .pk-side,body.phone .pk-side{left:10px; width:auto; top:auto; max-height:56%;}
body.mob .pk-stat,body.phone .pk-stat{display:none;}
body.mob .pk-pbar,body.phone .pk-pbar{flex-direction:column; align-items:flex-start;}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:18px;}
.grid2 h4{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--faint); margin:0 0 7px; font-weight:500;}

.card{display:flex; gap:16px; align-items:center; padding:22px 26px;}
.card img{width:74px; height:74px; border-radius:16px; object-fit:cover; border:1px solid var(--line2);}
.card b{display:block; font-family:var(--ui); font-size:18px; font-weight:600; color:var(--txt);}
.card .r{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.09em;
  margin-top:3px;}
.links{padding:0 26px 24px; display:flex; flex-direction:column; gap:7px;}
.links a{font-family:var(--mono); font-size:12px; color:var(--sig-ink); text-decoration:none;
  border-bottom:1px solid rgba(185,100,10,.3); align-self:flex-start;}

.mb{display:none;}

body.mob .mb{display:inline;}

body.mob #tasks{display:none;}
body.mob .doc{padding:18px 16px 26px;}

/* =====================================================================
   NIGHT SKY
   The whole scene lives in #space, one layer stack under the desk:
   dome (sky gradient) -> nebulae -> milky way -> stars -> coordinate grid.
   Day mode never paints any of it.

   Techniques adapted from two MIT-licensed projects:
     CK42BB/procedural-stars-threejs (MIT, (c) 2026 Kingsley)
       magnitude to brightness, multi-frequency twinkle, the core+glow star
       profile, milky way as band * fbm * (1 - dust) + core, sky dome with
       a horizon glow term for light pollution.
     H0rn0chse/NightSky (MIT, (c) 2022 H0rn0chse)
       star density scaled to viewport area, stars split into parallax layers.
   Both are GLSL / generated-CSS originally. This is a 2D canvas rewrite.
   ===================================================================== */

#space{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  opacity:0; visibility:hidden;
  transition:opacity 1.15s ease, visibility 0s linear 1.15s;}
html[data-theme=night] #space{opacity:1; visibility:visible;
  transition:opacity 1.15s ease, visibility 0s linear 0s;}
#space > *{position:absolute;}
#space canvas{inset:0; width:100%; height:100%; display:block;}

/* the sky itself. Zenith at the top, and a warm haze at the horizon: that is
   light pollution, and it is painted in the signature orange so the scene
   stays on brand instead of going generic-space-blue. */
.dome{inset:0;
  background:
    radial-gradient(120% 48% at 46% 110%, rgba(255,154,60,.085) 0%, rgba(255,154,60,0) 60%),
    radial-gradient(92% 60% at 20% 6%, rgba(58,80,142,.16) 0%, transparent 66%),
    linear-gradient(177deg,#03040A 0%,#05070E 36%,#070A14 68%,#0B1020 100%);}

/* a reflection nebula: dust scattering starlight, so blue dominates. Chosen
   over an emission nebula because vivid pink would fight the interface. */
.neb{display:none;}   /* the shader carries the colour; these are kept for the photo mode */
.neb.n1{left:-16%; top:-20%; width:64%; height:76%;
  background:radial-gradient(circle, rgba(68,136,221,.10) 0%, rgba(68,136,221,0) 66%);
  animation:nd1 124s ease-in-out infinite;}
.neb.n2{left:22%; top:30%; width:72%; height:84%;
  background:radial-gradient(circle, rgba(104,150,206,.10) 0%, rgba(118,92,190,.07) 42%, rgba(104,150,206,0) 72%);
  animation:nd2 168s ease-in-out infinite;}
.neb.n3{left:-10%; bottom:-34%; width:84%; height:64%;
  background:radial-gradient(circle, rgba(255,154,60,.12) 0%, rgba(255,154,60,0) 64%);
  animation:nd3 98s ease-in-out infinite;}
@keyframes nd1{0%,100%{transform:translate(0,0)}50%{transform:translate(4%,3%)}}
@keyframes nd2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5%,-2.5%)}}
@keyframes nd3{0%,100%{transform:translate(0,0)}50%{transform:translate(3%,-2%)}}

/* ---------- the photograph ----------
   NASA, ESA, CSA, STScI. JWST NIRCam and MIRI, the Crab Nebula (M1), the
   wreckage of the supernova Chinese astronomers recorded in 1054.
   The texture is even across the frame, so the scrims below darken evenly
   rather than knocking back one edge. 2958px wide, 521KB webp. */
.photo{left:-24px; top:-24px; width:calc(100% + 48px); height:calc(100% + 48px);
  background:none center center / cover no-repeat;
  opacity:0; transition:opacity 2.2s ease .18s; will-change:transform;}
html[data-theme=night] body.photosky .photo{opacity:1;}
/* the plate is the backdrop, not the subject: knock the lit ridge back, cool
   the blue toward the interface navy, and keep the middle readable */
.scrim{inset:0; background:
  linear-gradient(to top, rgba(3,4,10,.40) 0%, rgba(3,4,10,.16) 14%, transparent 34%),
  linear-gradient(to bottom, rgba(6,9,19,.28) 0%, rgba(6,9,19,.06) 20%, transparent 36%),
  radial-gradient(72% 60% at 83% 30%, rgba(4,6,14,.30) 0%, rgba(4,6,14,0) 74%),
  radial-gradient(118% 92% at 44% 46%, rgba(5,8,17,0) 0%, rgba(4,6,14,.46) 100%),
  linear-gradient(rgba(8,11,22,.22), rgba(8,11,22,.22));}
body.photosky #gal,body.photosky #mwc,body.photosky .neb{display:none;}
html:not([data-theme=night]) .scrim{opacity:0;}
.scrim{opacity:0; transition:opacity 2.2s ease .18s;}
html[data-theme=night] body.photosky .scrim{opacity:1;}

/* the galaxy, drawn by a fragment shader at full device resolution.
   Oversized so the parallax shift never exposes an edge. */
#gal{left:-20px; top:-20px; width:calc(100% + 40px); height:calc(100% + 40px);
  opacity:0; transition:opacity 2.2s ease .25s; will-change:transform;}
html[data-theme=night] #gal{opacity:1;}

/* the faint field: thousands of stars, painted once, moved as a whole */
#fine{opacity:0; transition:opacity 1.7s ease .12s;}
html[data-theme=night] #fine{opacity:1;}

/* the 2d galaxy, used only where webgl is missing */
#mwc{left:-14px; top:-14px; width:calc(100% + 28px); height:calc(100% + 28px);
  opacity:0; transition:opacity 2.1s ease .3s; will-change:transform;}
html[data-theme=night] #mwc{opacity:1;}

/* depth: the corners fall away from the eye */
.vig{inset:0; background:radial-gradient(132% 96% at 48% 44%,
  rgba(0,0,0,0) 52%, rgba(2,3,8,.12) 78%, rgba(2,3,8,.34) 100%);}

/* the millimetre paper of day becomes a coordinate grid at night */
.dgrid{inset:0;
  background-image:
    linear-gradient(rgba(150,180,255,.040) 1px, transparent 1px),
    linear-gradient(90deg, rgba(150,180,255,.040) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(118% 96% at 50% 48%, #000 14%, transparent 76%);
  mask-image:radial-gradient(118% 96% at 50% 48%, #000 14%, transparent 76%);}
#grid{transition:opacity .9s ease;}
html[data-theme=night] #grid{opacity:0;}

/* ---------- night tokens ---------- */
html[data-theme=night]{
  --chassis:#080A10; --deck:#0C0F18; --panel:#141824; --panel2:#1A1F2C;
  --line:rgba(158,180,224,.10); --line2:rgba(158,180,224,.19); --line3:rgba(158,180,224,.31);
  --txt:#E6EAF4; --dim:#9AA4BA; --faint:#6C758E;
  --sig:#FFA24D; --sig-ink:#FFB066; --sig-dim:#C07B33; --sig-soft:rgba(255,162,77,.15);
  --shadow:rgba(0,0,0,.62);
}
html[data-theme=night] ::selection{background:var(--sig); color:#160E04;}

/* ---------- chrome ---------- */
html[data-theme=night] #top,
html[data-theme=night] #bar{background:rgba(9,12,20,.46);
  -webkit-backdrop-filter:blur(20px) saturate(1.2); backdrop-filter:blur(20px) saturate(1.2);}
html[data-theme=night] #top button:hover,
html[data-theme=night] #bar .k:hover,
html[data-theme=night] .tbar .ctl button:hover{background:rgba(180,200,255,.09);}
html[data-theme=night] #desk{background:#05060B;}
html[data-theme=night] .body::-webkit-scrollbar-thumb{background:rgba(170,190,235,.17);}
html[data-theme=night] .body::-webkit-scrollbar-thumb:hover{background:rgba(170,190,235,.30);}
html[data-theme=night] #pal{background:rgba(4,6,12,.55);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
html[data-theme=night] #palbox,
html[data-theme=night] #menu{background:rgba(20,24,36,.92);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  box-shadow:0 26px 62px rgba(0,0,0,.66);}

/* ---------- orbit and asterism ---------- */
html[data-theme=night] #sky circle.ra{stroke:rgba(178,200,255,.22);}
html[data-theme=night] #sky .cl{stroke:rgba(206,226,255,.62); stroke-width:1.15;}
html[data-theme=night] #sky .cd{opacity:0;}        /* the canvas draws these instead */
html[data-theme=night] #sky text.ct{fill:#B9C6E2;}
#sky text.ct,#sky circle.ra,#sky .cl{transition:fill .7s ease, stroke .7s ease;}
#sky text.cal{font-size:8px; letter-spacing:.24em; fill:#79839C; opacity:0;}
html:not([data-theme=night]) #sky text.cal{opacity:0 !important;}

/* ---------- the planet ---------- */
.planet .cap{position:relative; z-index:1;}
.planet .orb{transition:box-shadow 1.15s ease;}
/* the night surface fades in on a pseudo element, because a gradient swap
   cannot be transitioned and the planet must not snap while the sky fades */
.planet .orb::before{content:""; position:absolute; inset:0; border-radius:50%;
  opacity:0; transition:opacity 1.15s ease;
  background:
    radial-gradient(circle at 74% 79%, rgba(255,162,77,.52) 0%, rgba(255,162,77,0) 33%),
    radial-gradient(circle at 33% 25%, #8B98B6 0%, #5B6580 25%, #353D55 51%, #1C2130 74%, #0D1018 100%);
  box-shadow:inset -16px -14px 36px rgba(0,0,0,.72),
             inset 11px 9px 26px rgba(152,178,228,.11);}
html[data-theme=night] .planet .orb::before{opacity:1;}
/* the shader planet, when the gpu can draw one. It sits proud of the orb so
   the atmosphere has somewhere to glow. */
/* ---------- the solar system ----------
   body.sysgl is set only when the gpu actually drew the bodies, so a machine
   without webgl keeps the css sphere and the ordinary folder tiles. */
#sys{opacity:0; transition:opacity 1.2s ease .28s;}
html[data-theme=night] #sys{opacity:1;}

/* the centre is a star now, and a star does not wear a ring */
#coreA .lb,#coreA .lf,#coreA .halo{transition:opacity .9s ease;}
html[data-theme=night] body.sysgl #coreA .lb,
html[data-theme=night] body.sysgl #coreA .lf,
html[data-theme=night] body.sysgl #coreA .halo{opacity:0;}
html[data-theme=night] body.sysgl .planet .orb{background:none; box-shadow:none;}
html[data-theme=night] body.sysgl .planet .orb::before{opacity:0;}
html[data-theme=night] body.sysgl .planet:hover{transform:none;}
/* the label steps off the star and sits under it, like every other body */
html[data-theme=night] body.sysgl .planet .cap{position:absolute; left:-46px; right:-46px;
  top:calc(100% + 13px); text-align:center; color:#EBC896;
  text-shadow:0 1px 4px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.7);}

/* each orbiting folder is a world, so its tile stops being a tile. Not on
   the phone layout: a window narrowed below 760px turns the orbit back into
   a list, and a list row with no icon is just a word. */
html[data-theme=night] body.sysgl:not(.mob) .ico.sys .tile,
html[data-theme=night] body.sysgl:not(.mob) .ico.con .tile{background:none; border-color:transparent;
  box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none;}
html[data-theme=night] body.sysgl:not(.mob) .ico.sys .tile svg,
html[data-theme=night] body.sysgl:not(.mob) .ico.con .tile svg{opacity:0;}
html[data-theme=night] body.sysgl:not(.mob) .ico.con.moving .tile,
html[data-theme=night] body.sysgl:not(.mob) .ico.con.ret .tile{box-shadow:none;}
html[data-theme=night] body.sysgl:not(.mob) .ico.con.sel .tile{box-shadow:0 0 0 2px rgba(255,162,77,.55);}
html[data-theme=night] body.sysgl:not(.mob) .ico.sys.moving .tile,
html[data-theme=night] body.sysgl:not(.mob) .ico.sys.ret .tile{box-shadow:none;}
html[data-theme=night] body.sysgl:not(.mob) .ico.sys.sel .tile{box-shadow:0 0 0 2px rgba(255,162,77,.55);}
html[data-theme=night] .planet .orb{
  box-shadow:0 0 0 1px rgba(186,208,255,.10), 0 0 72px rgba(108,144,226,.17);}
html[data-theme=night] .planet .cap{color:#EDF1F8;
  text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.6);}
html[data-theme=night] .planet .halo{width:120%; height:120%;
  background:radial-gradient(circle, rgba(122,162,255,.19) 0%, rgba(122,162,255,0) 62%);}
html[data-theme=night] .planet .rf{filter:drop-shadow(0 0 5px rgba(255,162,77,.6));}

/* ---------- icons read as instruments floating in the dark ---------- */
html[data-theme=night] .ico .tile{background:rgba(26,31,45,.62);
  -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
  border-color:rgba(176,198,246,.13);
  box-shadow:0 6px 20px rgba(0,0,0,.55), inset 0 1px 0 rgba(200,220,255,.07);}
html[data-theme=night] .ico .g{stroke:#FFAE5E;}
html[data-theme=night] .ico .gf{fill:#FFAE5E;}
html[data-theme=night] .ico svg{filter:drop-shadow(0 0 5px rgba(255,150,50,.42));}
html[data-theme=night] .ico span{color:#C3CBDD; text-shadow:0 1px 4px rgba(0,0,0,.9);}
html[data-theme=night] .ico:hover{background:rgba(180,205,255,.07);}
html[data-theme=night] .ico.sel{background:rgba(180,205,255,.11); border-color:rgba(255,162,77,.5);}
html[data-theme=night] .ico.sel span{color:var(--txt);}
html[data-theme=night] .ico.moving .tile{box-shadow:0 16px 30px rgba(0,0,0,.6), 0 0 0 2px rgba(255,162,77,.55);}
html[data-theme=night] .ico.ret .tile{box-shadow:0 10px 24px rgba(0,0,0,.5), 0 0 0 2px rgba(255,162,77,.34);}
.ico .tile,.ico span,.ico svg{transition:background-color .7s ease, color .7s ease,
  border-color .7s ease, box-shadow .7s ease, filter .7s ease;}

/* ---------- windows read as glass held up against the sky ---------- */
html[data-theme=night] .win{background:rgba(17,21,32,.88);
  -webkit-backdrop-filter:blur(18px) saturate(1.15); backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:0 18px 52px rgba(0,0,0,.62);}
html[data-theme=night] .win.on{box-shadow:0 28px 72px rgba(0,0,0,.7), 0 0 0 1px rgba(255,162,77,.4);}
html[data-theme=night] .tbar{background:rgba(27,32,46,.72);}
html[data-theme=night] .doc .rail{background:rgba(160,185,240,.045);}
html[data-theme=night] .doc.mono a,
html[data-theme=night] .links a{border-bottom-color:rgba(255,176,102,.38);}
.win,.tbar{transition:background-color .7s ease, box-shadow .7s ease, border-color .7s ease;}
body,#desk{transition:background-color .7s ease, color .7s ease;}

/* ---------- the toggle ---------- */
#thbtn{letter-spacing:.15em; display:flex; align-items:center; gap:6px;}
#thbtn i{display:block; width:7px; height:7px; border-radius:50%; font-style:normal;
  border:1px solid currentColor; transition:box-shadow .5s ease, background .5s ease;}
html[data-theme=night] #thbtn i{background:var(--sig); border-color:var(--sig);
  box-shadow:0 0 8px var(--sig);}

/* the sky is drawn from a real catalogue, and the catalogue gets its line.
   Faint, technical, out of the way: bottom left, because the bottom right
   belongs to the telescope. */
#credit{position:absolute; left:14px; bottom:10px; z-index:2; pointer-events:none;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.22em; color:#9AA4BA;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  opacity:0; transition:opacity 1.4s ease .6s;}
html[data-theme=night] #credit{opacity:1;}
body.phone #credit{display:none;}

/* ---------- phone ----------
   The phone runs the same machine as the desktop: the orbit, the seven
   stars, the telescope, and at night the solar system under the real sky.
   Only the windows change, because a floating window does not fit a phone:
   they open full screen and close back to the desk.
   src.html marks a phone with a class that turns the desk into a list. The
   night build marks it with body.phone instead, so none of the list rules
   apply, and the few phone rules still wanted are restated here. */
body.phone #top{gap:10px; padding:0 11px;}
body.phone #top .brand{white-space:nowrap; font-size:10px; letter-spacing:.13em;}
body.phone .dk{display:none;}
body.phone .mb{display:inline;}

   the pointer. The palette and the readme still list everything by name, and

html[data-theme=night] body.phone.sysgl #sky text.ct{opacity:1;}

/* ---------- the telescope ----------
   The night side is the best thing on this desk, and a button in the corner
   of the menu bar is easy to miss. So the desk gets a telescope in its own
   corner: the desk's own orange, no box, no label, standing straight on the
   desk. Every few seconds a star flares where it points, and that is the
   whole invitation. The button is padded past the drawing so it is still
   an easy target. */
#scope{position:absolute; right:24px; bottom:20px; z-index:1; padding:6px; border-radius:10px;}
#scope:focus-visible{outline:2px solid var(--sig); outline-offset:1px;}
#scope svg{width:30px; height:30px; display:block; overflow:visible;
  transition:transform .4s cubic-bezier(.2,1,.3,1), filter .4s ease;}
#scope:hover svg{transform:translateY(-2px); filter:drop-shadow(0 0 5px rgba(255,154,60,.45));}
#scope .g{fill:none; stroke:#F0800C; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; transition:stroke .7s ease;}
/* the tube pivots on its mount, so a hover lifts it a few degrees */
#scope .aim{transform-box:view-box; transform-origin:0 0;
  transform:translate(2px,-2.5px) rotate(33deg); transition:transform .6s cubic-bezier(.2,1,.3,1);}
#scope:hover .aim{transform:translate(2px,-2.5px) rotate(26deg);}

/* the star: twice a flare, then dark for five seconds, over and over, and
   the telescope catches a little of its light each time. It waits for
   .live, which arrives when the boot screen goes, so the first flare is one
   somebody can see. A hover holds it lit. */
#scope .spk{opacity:0; transform-box:fill-box; transform-origin:center;
  filter:drop-shadow(0 0 2.2px rgba(255,140,40,.95));}
#scope .spk .ray{fill:#FF9A3C;}
#scope .spk .core{fill:#FFF4E6;}
#scope.live .spk{animation:spark 6.5s ease-in-out 1.2s infinite;}
#scope.live svg{animation:sglow 6.5s ease-in-out 1.2s infinite;}
@keyframes spark{
  0%{opacity:0; transform:scale(.15) rotate(-30deg);}
  5%{opacity:1; transform:scale(1.6) rotate(0deg);}
  10%{opacity:.85; transform:scale(.95) rotate(12deg);}
  15%{opacity:1; transform:scale(1.25) rotate(22deg);}
  24%,100%{opacity:0; transform:scale(.2) rotate(45deg);}
}
@keyframes sglow{
  0%,24%,100%{filter:drop-shadow(0 0 0 rgba(255,154,60,0));}
  6%{filter:drop-shadow(0 0 5px rgba(255,154,60,.55));}
}
#scope:hover .spk{animation:none; opacity:1; transform:none;}
#scope:hover svg{animation:none;}

/* at night the telescope glows like every other instrument in the dark,
   and the star stops calling: the visitor is already where it pointed */
html[data-theme=night] #scope .g{stroke:#FFAE5E;}
html[data-theme=night] #scope svg{
  filter:drop-shadow(0 0 5px rgba(255,150,50,.42));}
html[data-theme=night] #scope:hover svg{filter:drop-shadow(0 0 8px rgba(255,150,50,.62));}
html[data-theme=night] #scope.live svg,
html[data-theme=night] #scope.live .spk{animation:none;}

@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }

               "I built the same workflow a second time on Microsoft Power Automate so the two could be compared properly. Querying that many sources and then running AI analysis over the results fell outside what the firm's license covered, so the agent build won: it runs inside existing subscription capacity with no additional infrastructure cost.",
               "Separately I designed the evaluation methodology used on AI output there: a weighted accuracy benchmark for AI assisted contract review, and a Turkish to English translation quality comparison."],
        rt:"Built with", rail:["Python, scheduled <b>agents</b>","<b>Supabase</b> central store","Streamlit for inspection","<b>Microsoft Graph</b> for delivery","Benchmarked against <b>Power Automate</b>","Relevance scoring and tagging"],
        tags:["Python","AI agents","Supabase","Microsoft Graph"] },
      tr:{ t:"Mevzuat İzleme", name:"Mevzuat İzleme Sistemi", meta:"2026 &middot; BTS &amp; Partners",
        lede:"107 kamu ve düzenleyici kaynağı izleyen, canlı ortamda kendi başına çalışan otonom bir ajan pipeline'ı.",
        paras:["Toplayıcı ajan her içeriği çekiyor, alaka puanı ve konu etiketiyle bir özet çıkarıyor ve merkezi veritabanına yazıyor. İki yayıncı ajan mevzuat ve haber bültenlerini kurumsal e-postayla dağıtıyor. Günlük işleyişte kimsenin dokunmasına gerek yok.",
               "Aynı iş akışını, ikisi düzgünce karşılaştırılabilsin diye Microsoft Power Automate üzerinde ikinci kez kurdum. Bu kadar kaynağı sorgulayıp sonuçlar üzerinde yapay zekâ analizi çalıştırmak şirketin lisans kapsamının dışında kalıyordu. Ajan versiyonu bu yüzden kazandı: mevcut abonelik kapasitesi içinde, ek altyapı maliyeti olmadan çalışıyor.",
               "Ayrıca orada yapay zekâ çıktıları için kullanılan değerlendirme yöntemini tasarladım: yapay zekâ destekli sözleşme incelemesi için ağırlıklı bir doğruluk benchmark'ı ve Türkçeden İngilizceye çeviri kalitesi karşılaştırması."],

    reporting:{ w:660, h:580, badges:[1,1,1],
      en:{ t:"Reporting", name:"Marketplace Reporting", meta:"2025 &middot; Tradist Distribution",
        lede:"Four marketplace APIs, four different response shapes, one report the company actually reads.",
        paras:["Sales lived in four separate marketplace back offices: Amazon, n11, Trendyol and Hepsiburada. Every month somebody opened each one, exported what it offered in whatever format it offered, and pasted the pieces together by hand. The formats did not agree with each other: different field names, different date handling, different ideas of what counts as a return.",
               "I pulled each channel through its own API, normalized the responses into one schema, and generated a single monthly report laid out the way the company reads it rather than the way any marketplace exports it. It removed more than five hours of manual gathering per month and, more usefully, removed the copy and paste errors that came with it."],
        rt:"What it does", rail:["Four <b>marketplace APIs</b>, pulled on schedule","Field mapping to <b>one schema</b>","Currency, date and return normalization","Company specific layout, not vendor layout","One monthly report, <b>5+ hours saved</b>"],
        tags:["Python","Apps Script","API integration"] },
      tr:{ t:"Raporlama", name:"Pazaryeri Raporlama", meta:"2025 &middot; Tradist Distribution",
        lede:"Dört pazaryeri API'si, dört farklı yanıt yapısı, şirketin gerçekten okuduğu tek bir rapor.",
        paras:["Satışlar dört ayrı pazaryeri panelinde duruyordu: Amazon, n11, Trendyol ve Hepsiburada. Her ay biri hepsini tek tek açıyor, her birinin sunduğu veriyi sunduğu formatta dışa aktarıyor ve parçaları elle birleştiriyordu. Formatlar birbirini tutmuyordu: farklı alan adları, farklı tarih biçimleri, neyin iade sayıldığına dair farklı kurallar.",
               "Her kanalı kendi API'si üzerinden çektim, yanıtları tek bir şemada normalize ettim ve herhangi bir pazaryerinin dışa aktardığı şekilde değil, şirketin okuduğu şekilde düzenlenmiş tek bir aylık rapor ürettim. Ayda beş saatten fazla elle veri toplamayı ortadan kaldırdı ve daha da önemlisi, onunla gelen kopyala yapıştır hatalarını da."],
        rt:"Ne yapıyor", rail:["Dört <b>pazaryeri API'si</b>, zamanlanmış çekim","Alanların <b>tek şemaya</b> eşlenmesi","Para birimi, tarih ve iade normalizasyonu","Pazaryerinin değil, şirketin düzeni","Tek aylık rapor, <b>ayda 5+ saat</b> kazanç"],
        tags:["Python","Apps Script","API entegrasyonu"] } },

    sms:{ w:660, h:580, badges:[1,1,1],
      en:{ t:"SMS Relay", name:"SMS Verification Relay", meta:"2025 &middot; Tradist Distribution",
        lede:"Marketplace verification codes pulled from SMS automatically, so the whole team reads them from one sheet instead of asking for them.",
        paras:["Amazon, n11, Trendyol and Hepsiburada send a verification code by SMS every time somebody signs in to the seller panel. The phones sat in a drawer. Whoever needed to log in had to find the right handset, unlock it, read the code out loud, and hope it had not expired by the time they typed it.",
               "I wrote an Android app that pulls those codes out of incoming SMS automatically and sends them to a shared Google Sheet the moment they land. It runs in the background and survives a device restart. Anyone who needs a code opens the sheet and takes it, without asking anybody: the code stopped being something one person physically possessed.",
               "It saved each person around twenty minutes a day. I found the need myself and built it on my own initiative; it was still running after I left."],
        rt:"How it works", rail:["Codes from <b>four marketplaces</b>","Pulled from SMS <b>automatically</b>","Sent to a shared <b>Google Sheet</b>","Runs in the background, survives restart","Nobody asks anybody for a code"],
        tags:["Android","Kotlin","Google Sheets"] },
      tr:{ t:"SMS Aktarıcı", name:"SMS Doğrulama Aktarıcı", meta:"2025 &middot; Tradist Distribution",
        lede:"Pazaryeri doğrulama kodları SMS'ten otomatik çekiliyor, ekip kodu kimseye sormadan tek bir tablodan okuyor.",
        paras:["Amazon, n11, Trendyol ve Hepsiburada satıcı paneline her girişte SMS ile doğrulama kodu gönderiyor. Telefonlar bir çekmecede duruyordu. Giriş yapması gereken kişi doğru cihazı bulmak, kilidini açmak, kodu yüksek sesle okumak ve yazana kadar süresinin dolmamasını ummak zorundaydı.",
               "Bu kodları gelen SMS'lerden otomatik olarak çeken ve geldiği anda ortak bir Google Sheets tablosuna yollayan bir Android uygulaması yazdım. Arka planda çalışıyor ve cihaz yeniden başlasa da devam ediyor. Kod lazım olan tabloyu açıp alıyor, kimse kimseye kod sormuyor: kod, tek bir kişinin elinde tuttuğu bir şey olmaktan çıktı.",
               "Kişi başı günde yaklaşık yirmi dakika kazandırdı. İhtiyacı kendim fark ettim ve kendi inisiyatifimle kurdum. Ben ayrıldıktan sonra da çalışıyordu."],
        rt:"Nasıl çalışıyor", rail:["<b>Dört pazaryerinden</b> gelen kodlar","SMS'ten <b>otomatik</b> çekiliyor","Ortak <b>Google Sheets</b> tablosuna gidiyor","Arka planda, yeniden başlatmaya dayanıklı","Kimse kimseye kod sormuyor"],
        tags:["Android","Kotlin","Google Sheets"] } }

     leave from a side of one box (r, l, t, b) and enter a side of another,
     as a curve that starts and ends square to those sides. */
  var DIA_T = { en:"How it flows", tr:"Nasıl akıyor" };
  function dia(D, L){
    var N = {}, s = "", DIR = { r:[1,0], l:[-1,0], t:[0,-1], b:[0,1] };
    D.nodes.forEach(function(n){ N[n.id] = n; });
    function port(n, side){
      return side==="r" ? [n.x+n.w, n.y+n.h/2] : side==="l" ? [n.x, n.y+n.h/2]
           : side==="t" ? [n.x+n.w/2, n.y] : [n.x+n.w/2, n.y+n.h];
    }
    (D.groups||[]).forEach(function(g){
      s += '<rect class="grp" x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'" rx="10"/>';
      s += '<text class="gt" x="'+(g.x+g.w/2)+'" y="'+(g.y+g.gy)+'">'+g.t[L]+'</text>';
    });
    (D.notes||[]).forEach(function(n){
      s += '<text class="el" x="'+n.x+'" y="'+n.y+'">'+n.t[L]+'</text>';
    });
    D.edges.forEach(function(e){
      var a = N[e.f], b = N[e.t], fs = e.fs || "r", ts = e.ts || "l";
      var p = port(a, fs), q = port(b, ts), da = DIR[fs], db = DIR[ts];
      var k = e.k || Math.max(18, Math.hypot(q[0]-p[0], q[1]-p[1])*0.42);
      var c1 = [p[0]+da[0]*k, p[1]+da[1]*k], c2 = [q[0]+db[0]*(k+6), q[1]+db[1]*(k+6)];
      var q2 = [q[0]+db[0]*6, q[1]+db[1]*6];   /* the line stops where the head starts */
      s += '<path class="de" d="M'+p+' C'+c1+' '+c2+' '+q2+'"/>';
      var ux = -db[0], uy = -db[1];            /* heading into the box */
      s += '<path class="ah" d="M'+q+' L'+(q[0]-ux*7-uy*3.6)+','+(q[1]-uy*7+ux*3.6)
         + ' L'+(q[0]-ux*7+uy*3.6)+','+(q[1]-uy*7-ux*3.6)+'Z"/>';
      if(e.lbl) s += '<text class="el" x="'+e.lx+'" y="'+e.ly+'">'+e.lbl[L]+'</text>';
    });
    D.nodes.forEach(function(n){
      var cls = "dn" + (n.hi ? " hi" : "") + (n.nt ? " nt" : "");
      if(n.stack) for(var i=2; i>0; i--)
        s += '<rect class="dn" x="'+(n.x+i*4)+'" y="'+(n.y-i*4)+'" width="'+n.w+'" height="'+n.h+'" rx="7"/>';
      s += '<rect class="'+cls+'" x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="7"/>';
      var ln = n.t[L], y0 = n.y + n.h/2 - (ln.length-1)*7 + 4;
      ln.forEach(function(t, i){
        var c = i ? "" : (n.hi ? "dt hi" : "dt");
        s += '<text'+(c ? ' class="'+c+'"' : '')+' x="'+(n.x+n.w/2)+'" y="'+(y0+i*14)+'">'+t+'</text>';
      });
    });
    return '<div class="dia"><h3>'+DIA_T[L]+'</h3><svg viewBox="-4 -8 '+(D.w+8)+' '+(D.h+12)+'" role="img" aria-label="'+DIA_T[L]+'">'+s+'</svg></div>';
  }

  function pkMount(root, L){
    if(root._pk) return; root._pk = 1;
    var T = PK_T[L], KINDS = PKG.kinds, RELS = PKG.rels;
    var cv = root.querySelector("canvas"), ctx = cv.getContext("2d");
    var stage = root.querySelector(".pk-stage"), tip = root.querySelector(".pk-tip");
    var side = root.querySelector(".pk-side"), leg = root.querySelector(".pk-leg");
    function lab(n){ return typeof n.lab === "string" ? n.lab : n.lab[L==="tr" ? 0 : 1]; }

    /* ---- the graph ---- */
    var seed = 7; function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
    var N = PKG.n.map(function(r, i){
      var a = rnd()*Math.PI*2, d = 60 + rnd()*220;
      return { i:i, k:KINDS[r[0]], lab:r[1], st:r[2], deg:0, nb:[], x:Math.cos(a)*d, y:Math.sin(a)*d, vx:0, vy:0, fx:null };
    });
    var E = PKG.e.map(function(r){
      var e = { a:N[r[0]], b:N[r[1]], rel:RELS[r[2]] };
      /* tags and disciplines touch everything; loose springs keep them from
         pulling the whole graph into one ball */
      e.len = e.rel === "tagged_with" ? 70 : 42;
      e.a.deg++; e.b.deg++;
      e.a.nb.push({ n:e.b, rel:e.rel, out:true }); e.b.nb.push({ n:e.a, rel:e.rel, out:false });
      return e;
    });
    N.forEach(function(n){ n.r = Math.min(17, 3.2 + Math.sqrt(n.deg)*1.75); });
    E.forEach(function(e){ e.k = 1/Math.min(e.a.deg, e.b.deg); });
    N.slice().sort(function(a, b){ return b.deg - a.deg; }).forEach(function(n, i){ n.rank = i; });
    var hidden = {}, alpha = 1, focus = null, hood = null, hover = null;

    /* forces in the d3 manner: a 1/d charge, links whose strength is
       1/min(degree) so hubs do not swallow the graph, a weak pull to the
       centre and a collision pass so the dots never sit on each other */
    function tick(){
      var i, j, a, b, dx, dy, d2, d, f, l, n = N.length;
      for(i=0; i<n; i++){ a = N[i];
        for(j=i+1; j<n; j++){ b = N[j];
          dx = b.x-a.x; dy = b.y-a.y; d2 = dx*dx+dy*dy;
          if(d2 > 160000) continue;
          if(d2 < 1){ dx = rnd()-.5; dy = rnd()-.5; d2 = 1; }
          f = -70*alpha/d2;
          b.vx -= dx*f; b.vy -= dy*f; a.vx += dx*f; a.vy += dy*f;
          d = Math.sqrt(d2); l = a.r + b.r + 4;
          if(d < l){ f = (l-d)/d*.35; b.vx += dx*f; b.vy += dy*f; a.vx -= dx*f; a.vy -= dy*f; }
        }

        dx = (b.x+b.vx)-(a.x+a.vx); dy = (b.y+b.vy)-(a.y+a.vy); d = Math.sqrt(dx*dx+dy*dy) || 1;
        l = (d - E[i].len)/d*alpha*E[i].k;
        dx *= l; dy *= l;
        var w = b.deg/(a.deg+b.deg);
        b.vx -= dx*w; b.vy -= dy*w; a.vx += dx*(1-w); a.vy += dy*(1-w);
      }
      for(i=0; i<n; i++){ a = N[i];
        a.vx -= a.x*.02*alpha; a.vy -= a.y*.02*alpha;
        a.vx *= .6; a.vy *= .6;
        if(a.fx != null){ a.x = a.fx; a.y = a.fy; a.vx = a.vy = 0; }
        else { a.x += a.vx; a.y += a.vy; }

    /* ---- camera ---- */

    function fitCam(anim){
      var x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;

        x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });

    function rgba(hex, a){

    function stCol(st){
      if(st==="shipped" || st==="archived" || st==="cancelled") return "#4ADE80";
      if(st==="in_progress" || st==="review" || st==="drafting") return "#60A5FA";
      return "#F87171";

        var on = hood ? (hood[e.a.i] && hood[e.b.i] && (e.a===focus || e.b===focus || hood[e.a.i]===1 && hood[e.b.i]===1))

        if(hidden[n.k]) continue;
        p = toScr(n); var r = Math.max(2, n.r*zs), L1 = lit(n), c = PK_COL[n.k];
        if(p.x < -30 || p.y < -30 || p.x > W+30 || p.y > H+30) continue;
        ctx.globalAlpha = sel && !L1 ? .13 : 1;
        if(!sel || L1){ ctx.shadowColor = c; ctx.shadowBlur = (n===focus || n===hover) ? 22 : 9; }
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;

        if(n === focus){ ctx.strokeStyle = "#E8E8EE"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, r+4, 0, 7); ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
      ctx.font = "500 10.5px Archivo, Inter, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
      /* labels go down in order of importance and skip any spot already
         taken, so the dense middle stays readable */
      var cand = [];
      for(i=0; i<N.length; i++){ n = N[i];
        if(hidden[n.k]) continue;
        var show = sel ? lit(n) && (n===focus || n===hover || n.deg*cam.s > 5 || (hood && hood[n.i]===1) || (hover && cam.s > .7))
                       : n.rank < Math.max(8, 8 + 34*(cam.s - 1));
        if(show) cand.push(n);
      }
      cand.sort(function(a, b){
        var pa = (a===focus || a===hover) ? -1 : a.rank, pb = (b===focus || b===hover) ? -1 : b.rank;
        return pa - pb;
      });
      var boxes = [];
      cand.forEach(function(n){
        var p = toScr(n), t = lab(n); if(t.length > 28) t = t.slice(0, 27) + "…";
        var tw = ctx.measureText(t).width, ty = p.y + Math.max(2, n.r*zs) + 4;
        var bx = { x0:p.x - tw/2 - 3, x1:p.x + tw/2 + 3, y0:ty - 1, y1:ty + 13 };
        if(n !== focus && n !== hover && boxes.some(function(o){ return bx.x0 < o.x1 && bx.x1 > o.x0 && bx.y0 < o.y1 && bx.y1 > o.y0; })) return;
        boxes.push(bx);
        ctx.lineWidth = 3; ctx.strokeStyle = "rgba(11,11,15,.85)"; ctx.strokeText(t, p.x, ty);
        ctx.fillStyle = (n===focus || n===hover) ? "#FFFFFF" : "rgba(232,232,238,.82)";
        ctx.fillText(t, p.x, ty);

    }

    /* ---- loop: runs only while something moves ---- */
    var raf = 0;

      raf = 0;

      if(camTo){
        cam.x += (camTo.x-cam.x)*.16; cam.y += (camTo.y-cam.y)*.16; cam.s += (camTo.s-cam.s)*.16;
        if(Math.abs(camTo.x-cam.x) + Math.abs(camTo.y-cam.y) < .5 && Math.abs(camTo.s-cam.s) < .004){ cam = camTo; camTo = null; }

    /* ---- focus and the side panel ---- */
    function setFocus(n, centre){

        if(centre){

        var c = N.filter(function(n){ return n.k===k; }).length;
        return '<button data-k="'+k+'" class="'+(hidden[k] ? 'off' : '')+'"><i style="background:'+PK_COL[k]+'"></i>'+T.kinds[k]+' <em>'+c+'</em></button>';
      }).join('');
    }
    leg.addEventListener("click", function(ev){
      var b = ev.target.closest("button[data-k]"); if(!b) return;

    /* ---- pointer: hover, click, drag a node, pan the canvas, zoom ---- */
    function hit(px, py){
      var best = null, bd = 1e9;
      N.forEach(function(n){ if(hidden[n.k]) return;
        var p = toScr(n), d = Math.hypot(p.x-px, p.y-py), r = Math.max(2, n.r*Math.sqrt(cam.s)) + 5;
        if(d < r && d < bd){ bd = d; best = n; } });

    var drag = null;
    function local(ev){ var r = cv.getBoundingClientRect(); return { x:ev.clientX-r.left, y:ev.clientY-r.top }; }
    cv.addEventListener("pointerdown", function(ev){
      var p = local(ev), n = hit(p.x, p.y);

    });
    cv.addEventListener("pointermove", function(ev){
      var p = local(ev);

        if(drag.moved > 4){
          if(drag.n){ var w = toWorld(p.x, p.y); drag.n.fx = w.x; drag.n.fy = w.y; alpha = Math.max(alpha, .28); }

          "node scripts/q.mjs \"nodes?id=eq."+id+"&select=*\"",

          "node scripts/q.mjs \"node_notes?node_id=eq."+id+"&order=created_at\"", "```", "",
          "## Final çıktı şablonu", "", "```yaml",

          "4. **Follow the final template.** It matches the schema and the Zettelkasten rules.", "",
          "## Connect to my notebook (first)", "", "```", "@CLAUDE.md", "```", "", "```bash",

          "## Final output template", "", "```yaml",
          "closing_note: |", "  ...", "new_nodes:", "  - kind: finding | concept | source", "    title: ...",

    /* ---- the game: two phases, then the app's FSRS update ---- */
    var gameEl = root.querySelector(".pk-game");
    var pool = E.filter(function(e){ return e.a.k==="concept" && e.b.k==="concept" && PK_PLAY.indexOf(e.rel) >= 0; });
    var concepts = N.filter(function(n){ return n.k==="concept"; });
    var game = { cur:null, played:0, good:0, mem:{} };
    function pick(arr, k, not){
      var out = [], guard = 0;
      while(out.length < k && guard++ < 500){

    }
    function shuffle(a){ for(var i=a.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

          }).join('')+'</div>';

          + g.rels.map(function(r, i){

            }).join('')+'</div>';

          + '<div class="pk-rate r'+rating+'">'+[T.again,T.hard,T.good][rating-1]+'</div>'

  function buildApps(L){
    var o = {
      readme:{ t:(L==="tr" ? "BENİOKU.txt" : "README.txt"), w:560, h:430, html:readme(L) }
    };
    PORDER.forEach(function(id){
      var p = PROJ[id]; o[id] = { t:p[L].t, w:p.w, h:p.h, html:proj(p[L], p.badges, L, id) };
    });
    o.tools   = { t:TOOLS[L].t, w:560, h:360, html:tools(L) };
    o.plain   = { t:PLAIN[L].t, w:640, h:540, html:plain(L) };
    o.contact = { t:(L==="tr" ? "İletişim" : "Contact"), w:420, h:260, html:contact(L) };
    return o;
  }
  var APPS_BY = { en:buildApps("en"), tr:buildApps("tr") };
  var APPS = APPS_BY[LANG];

  var DESK = ["readme","karinca","istakip","pipeline","reporting","sms","tools","plain","contact"];
  var ORB  = ["karinca","istakip","pipeline","reporting","sms","tools","plain","contact"];
  var RING = { karinca:0, istakip:0, pipeline:0, reporting:0, sms:0, tools:1, plain:1, contact:1 };

  /* ---------- desktop icons ---------- */
  var iconsEl = $("icons");
  ORB.forEach(function(id){
    var b = document.createElement("div");
    b.className = "ico"; b.setAttribute("data-app", id); b.tabIndex = 0;
    b.innerHTML = '<span class="tile">'+ART[id]+'</span><span>'+APPS[id].t+'</span>';
    iconsEl.appendChild(b);
  });

  /* ---------- window manager ---------- */
  var winsEl = $("wins"), deskEl = $("desk"), tasksEl = $("tasks"), ghost = $("ghost");
  var open = {}, zTop = 10, focused = null, cascade = 0;
  var MOB = false;
  function measure(){ MOB = innerWidth < 760; document.body.classList.toggle("phone", MOB); }
  measure();
  addEventListener("resize", function(){
    measure();
    NIGHT.resize();
    glide(measureSky, 560);
  });

  function bounds(){ var r = deskEl.getBoundingClientRect(); return { w:r.width, h:r.height }; }

  function focus(id){
    if(focused && open[focused]) open[focused].el.classList.remove("on");
    focused = id;
    var w = open[id]; if(!w) return;
    w.el.classList.add("on");
    w.el.style.zIndex = ++zTop;
    paintTasks();
  }

  function paintTasks(){
    tasksEl.innerHTML = "";
    Object.keys(open).forEach(function(id){
      var b = document.createElement("button");
      b.className = "tk" + (id===focused && !open[id].mini ? " on" : "");
      b.innerHTML = '<i></i><span>'+APPS[id].t+'</span>';
      b.addEventListener("click", function(){
        var w = open[id];
        if(w.mini){ w.mini=false; w.el.style.display="flex"; focus(id); }
        else if(id===focused){ minimize(id); }
        else focus(id);
      });
      tasksEl.appendChild(b);
    });
  }

  function minimize(id){
    var w = open[id]; if(!w || MOB) return;
    w.el.classList.add("min");
    setTimeout(function(){ w.el.classList.remove("min"); w.el.style.display="none"; w.mini=true;
      if(focused===id){ focused=null; }
      paintTasks();
    }, reduce?0:170);
  }

  function close(id){
    var w = open[id]; if(!w) return;
    w.el.remove(); delete open[id];
    if(focused===id) focused=null;
    var rest = Object.keys(open);
    if(rest.length) focus(rest[rest.length-1]);
    paintTasks(); save();
  }

  function maxToggle(id){
    var w = open[id]; if(!w || MOB) return;
    var b = bounds();
    if(w.maxed){ set(w, w.prev); w.maxed=false; }
    else { w.prev = { x:w.x, y:w.y, w:w.w, h:w.h };
           set(w, { x:0, y:0, w:b.w, h:b.h }); w.maxed=true; }
    save();
  }

  function set(w, r){
    w.x=r.x; w.y=r.y; w.w=r.w; w.h=r.h;
    w.el.style.left=r.x+"px"; w.el.style.top=r.y+"px";
    w.el.style.width=r.w+"px"; w.el.style.height=r.h+"px";
  }

  function launch(id, rect){
    if(open[id]){ var w0=open[id];
      if(w0.mini){ w0.mini=false; w0.el.style.display="flex"; }
      focus(id); return; }
    var a = APPS[id]; if(!a) return;
    var b = bounds();
    var el = document.createElement("div");
    el.className = "win" + (reduce ? "" : " pop");
    el.innerHTML =
      '<div class="tbar"><span class="nm">'+a.t+'</span><span class="sp"></span>'
      + '<span class="ctl"><button class="mn" title="'+ui("mn")+'">&#8211;</button>'
      + '<button class="mx" title="'+ui("mx")+'">&#9744;</button>'
      + '<button class="x" title="'+ui("x")+'">&#10005;</button></span></div>'
      + '<div class="body">'+a.html+'</div>'
      + '<div class="rz e"></div><div class="rz s"></div><div class="rz se"></div>';
    winsEl.appendChild(el);
    mountDemos(el);

    var ww = Math.min(a.w, b.w-40), wh = Math.min(a.h, b.h-40);
    var r = rect || { x: Math.max(16, Math.round((b.w-ww)/2) + cascade*26 - 52),
                      y: Math.max(14, Math.round((b.h-wh)/2) + cascade*20 - 34),
                      w: ww, h: wh };
    r.x = Math.max(0, Math.min(r.x, Math.max(0, b.w-160)));
    r.y = Math.max(0, Math.min(r.y, Math.max(0, b.h-46)));
    cascade = (cascade+1) % 5;

    var w = { el:el, id:id, x:0,y:0,w:0,h:0, mini:false, maxed:false, prev:null };
    open[id] = w; set(w, r);

    el.querySelector(".mn").addEventListener("click", function(e){ e.stopPropagation(); minimize(id); });
    el.querySelector(".mx").addEventListener("click", function(e){ e.stopPropagation(); maxToggle(id); });
    el.querySelector(".x").addEventListener("click", function(e){ e.stopPropagation(); close(id); });
    el.addEventListener("pointerdown", function(){ focus(id); }, true);
    var tb = el.querySelector(".tbar");
    tb.addEventListener("dblclick", function(){ maxToggle(id); });
    drag(w, tb);
    ["e","s","se"].forEach(function(k){ resize(w, el.querySelector(".rz."+k), k); });

    focus(id); paintTasks(); save();
    if(!reduce) setTimeout(function(){ el.classList.remove("pop"); }, 200);
  }

  /* ---------- drag with snap ---------- */
  function drag(w, handle){
    handle.addEventListener("pointerdown", function(e){
      if(MOB || e.target.closest("button")) return;
      var b = bounds(), sx = e.clientX, sy = e.clientY, ox = w.x, oy = w.y;
      var zone = null;
      handle.setPointerCapture && (function(){ try{ handle.setPointerCapture(e.pointerId); }catch(_){} })();
      function mv(ev){
        if(w.maxed){ w.maxed=false; var p=w.prev||{w:w.w,h:w.h};
          set(w,{x:ev.clientX-p.w/2, y:Math.max(0,ev.clientY-deskEl.getBoundingClientRect().top-15), w:p.w, h:p.h});
          ox=w.x; oy=w.y; sx=ev.clientX; sy=ev.clientY; }
        var nx = ox + (ev.clientX-sx), ny = oy + (ev.clientY-sy);
        nx = Math.max(-w.w+120, Math.min(b.w-120, nx));
        ny = Math.max(0, Math.min(b.h-32, ny));
        w.el.style.left = nx+"px"; w.el.style.top = ny+"px"; w.x=nx; w.y=ny;
        var dx = ev.clientX - deskEl.getBoundingClientRect().left;
        var dy = ev.clientY - deskEl.getBoundingClientRect().top;
        var nz = null;
        if(dx < 26) nz = "l"; else if(dx > b.w-26) nz = "r"; else if(dy < 12) nz = "t";
        if(nz !== zone){
          zone = nz;
          if(!zone){ ghost.classList.remove("on"); }
          else {
            var g = zone==="l" ? {x:0,y:0,w:b.w/2,h:b.h}
                  : zone==="r" ? {x:b.w/2,y:0,w:b.w/2,h:b.h}
                  : {x:0,y:0,w:b.w,h:b.h};
            ghost.style.left=g.x+"px"; ghost.style.top=g.y+"px";
            ghost.style.width=g.w+"px"; ghost.style.height=g.h+"px";
            ghost.classList.add("on");
          }
        }
      }
      function up(){
        handle.removeEventListener("pointermove", mv);
        handle.removeEventListener("pointerup", up);
        ghost.classList.remove("on");
        if(zone){
          if(!w.maxed) w.prev = { x:ox, y:oy, w:w.w, h:w.h };
          var b2 = bounds();
          if(zone==="t"){ set(w,{x:0,y:0,w:b2.w,h:b2.h}); w.maxed=true; }
          else set(w, zone==="l" ? {x:0,y:0,w:Math.round(b2.w/2),h:b2.h}
                                 : {x:Math.round(b2.w/2),y:0,w:Math.round(b2.w/2),h:b2.h});
        }
        save();
      }
      handle.addEventListener("pointermove", mv);
      handle.addEventListener("pointerup", up);

    });
  }

  function resize(w, handle, kind){
    handle.addEventListener("pointerdown", function(e){
      if(MOB) return;
      var b = bounds(), sx=e.clientX, sy=e.clientY, ow=w.w, oh=w.h;
      handle.setPointerCapture && (function(){ try{ handle.setPointerCapture(e.pointerId); }catch(_){} })();
      function mv(ev){
        var nw = ow, nh = oh;
        if(kind!=="s") nw = Math.max(300, Math.min(b.w - w.x, ow + (ev.clientX-sx)));
        if(kind!=="e") nh = Math.max(180, Math.min(b.h - w.y, oh + (ev.clientY-sy)));
        w.w=nw; w.h=nh; w.el.style.width=nw+"px"; w.el.style.height=nh+"px";
        w.maxed=false;
      }
      function up(){ handle.removeEventListener("pointermove",mv); handle.removeEventListener("pointerup",up); save(); }
      handle.addEventListener("pointermove", mv);
      handle.addEventListener("pointerup", up);

    });
  }

  /* ---------- session memory ---------- */
  function save(){
    try{
      var o = Object.keys(open).map(function(id){ var w=open[id];
        return { id:id, x:w.x, y:w.y, w:w.w, h:w.h, mini:w.mini, maxed:w.maxed }; });
      localStorage.setItem("desk_session", JSON.stringify(o));
    }catch(e){}
  }
  function restore(){
    var o = null;
    try{ o = JSON.parse(localStorage.getItem("desk_session")||"null"); }catch(e){}
    if(!o || !o.length) return false;
    var b = bounds();
    o.forEach(function(s){
      if(!APPS[s.id]) return;
      var ww = Math.max(300, Math.min(s.w, b.w-20)), wh = Math.max(180, Math.min(s.h, b.h-20));
      launch(s.id, MOB ? null : {
        x: Math.max(0, Math.min(s.x, Math.max(0, b.w-160))),
        y: Math.max(0, Math.min(s.y, Math.max(0, b.h-46))),
        w: ww, h: wh });
      if(open[s.id] && s.mini) minimize(s.id);
    });
    return true;
  }

  /* ---------- the system: one orbit, one constellation ---------- */
  var ICW = 104, ICH = 78, SQ = .70;
  var SYS = [
    { kind:"orb", el:$("coreA"), ring:$("ringA"), box:176, spd:0.040, cx:0, cy:0, r:0 },
    { kind:"con", el:null,       ring:$("conB"),  box:0,   spd:0,     cx:0, cy:0, r:0 }
  ];
  SYS[0].circ = SYS[0].ring.firstElementChild;

  /* Ursa Major. The seven positions come from the real right ascension and
     declination of the stars, projected flat, so the shape is the shape in the
     sky. Dubhe and Merak are the pointers that find Polaris, which is why the
     contact card sits on Dubhe. Mizar reads as one star and is really two. */
  var CSQ = 1.0;
  var VERT = [
    { nx: 0.8588, ny:-0.5269, ph:0.0, id:"contact", star:"dubhe", mag:1.81, bv: 1.061 },
    { nx: 1.0127, ny:-0.0939, ph:1.1, id:null,     star:"merak", mag:2.34, bv: 0.033 },
    { nx: 0.4376, ny: 0.2548, ph:2.2, id:"tools",  star:"phecda", mag:2.41, bv: 0.044 },
    { nx: 0.1593, ny:-0.0098, ph:3.3, id:null,     star:"megrez", mag:3.32, bv: 0.077 },
    { nx:-0.2953, ny: 0.0621, ph:4.4, id:null,     star:"alioth", mag:1.76, bv:-0.022 },
    { nx:-0.6652, ny: 0.0898, ph:5.5, id:"plain",  star:"mizar", mag:2.23, bv: 0.057 },
    { nx:-1.0868, ny: 0.4759, ph:6.6, id:null,     star:"alkaid", mag:1.85, bv:-0.099 }
  ];
  var LINES = [[0,1,2,3,0],[3,4,5,6]];
  var NXMAX=-9, NXMIN=9, NYMAX=-9, NYMIN=9;
  VERT.forEach(function(v){
    if(v.nx>NXMAX) NXMAX=v.nx; if(v.nx<NXMIN) NXMIN=v.nx;
    if(v.ny>NYMAX) NYMAX=v.ny; if(v.ny<NYMIN) NYMIN=v.ny;
  });

  var skyEl = $("sky");

  function nowT(){ return NOW || performance.now(); }

  /* build the constellation svg */

  var lineEls = LINES.map(function(){
    var e = document.createElementNS(NS,"polyline"); e.setAttribute("class","cl");
    conG.appendChild(e); return e;
  });
  VERT.forEach(function(v){
    if(v.id) return;
    v.el = document.createElementNS(NS,"circle");
    v.el.setAttribute("class","cd"); v.el.setAttribute("r","2.5");

  conLbl.setAttribute("class","ct"); conLbl.textContent = ui("about");

  Array.prototype.forEach.call(iconsEl.children, function(el){
    var id = el.getAttribute("data-app"), si = RING[id] || 0;
    var st = { id:id, el:el, sys:si, off:null, dx:0, dy:0, drag:false,
               nx:0, ny:0, arc:0, t0:0, dur:0, px:0, py:0 };
    if(si === 0){
      var kin = ORB.filter(function(x){ return (RING[x]||0) === 0; });

      for(var i=0; i<VERT.length; i++) if(VERT[i].id === id) st.vert = VERT[i];

  function measureSky(){
    var b = bounds();
    if(MOB && b.h >= b.w*0.75){ measurePhone(b); return; }   /* a phone on its side keeps the desktop row */
    var RA = Math.max(118, Math.min(b.w*0.232, (b.h*0.40)/SQ));
    var A = SYS[0], B = SYS[1];
    A.box = 176; A.el.style.width = A.el.style.height = "";
    A.r = RA;
    A.cx = Math.max(Math.round(RA + 56), Math.round(b.w*0.355));
    A.cy = Math.max(Math.round(RA*SQ + 46), Math.round(b.h*0.455));
    A.circ.setAttribute("r", A.r.toFixed(1));
    A.ring.setAttribute("transform", "translate("+A.cx+","+A.cy+") scale(1,"+SQ+")");
    A.el.style.left = (A.cx - A.box/2)+"px";
    A.el.style.top  = (A.cy - A.box/2)+"px";

    B.r = RA*0.50;
    B.cx = Math.min(Math.round(b.w - NXMAX*B.r - 58), Math.round(b.w*0.785));
    B.cx = Math.max(B.cx, Math.round(-NXMIN*B.r + 58));
    B.cy = Math.min(Math.round(b.h - NYMAX*B.r*CSQ - 96), Math.round(b.h*0.500));
    B.cy = Math.max(B.cy, Math.round(-NYMIN*B.r*CSQ + 56));
  }

  /* a phone gets the same machine, stacked for a tall screen: the orbit on
     top, the seven stars under it, the telescope in the corner. Sizes come
     from the width; if the screen is short, both shrink together until the
     stack fits, and whatever height is left over becomes breathing room. */
  function measurePhone(b){
    var A = SYS[0], B = SYS[1];
    var RA = Math.min(b.w*0.36, 150), BR = Math.min(b.w*0.385, 165);
    var CT = 29, CB = 51, FIX = ICH + CT + CB + 34;   /* overhangs and minimum gaps */
    var v = 2*RA*SQ + (NYMAX - NYMIN)*BR*CSQ;
    if(v + FIX > b.h){
      var k = Math.max(0.6, (b.h - FIX)/v);
      RA *= k; BR *= k; v *= k;
    }
    var spare = Math.max(0, b.h - FIX - v);
    A.r = RA;
    A.box = Math.round(Math.max(96, Math.min(150, RA*0.86)));
    A.el.style.width = A.el.style.height = A.box + "px";
    A.cx = Math.round(b.w/2);
    A.cy = Math.round(10 + spare*0.30 + RA*SQ + ICH/2);
    A.circ.setAttribute("r", A.r.toFixed(1));
    A.ring.setAttribute("transform", "translate("+A.cx+","+A.cy+") scale(1,"+SQ+")");
    A.el.style.left = (A.cx - A.box/2)+"px";
    A.el.style.top  = (A.cy - A.box/2)+"px";
    B.r = BR;
    B.cx = Math.round(b.w/2 - (NXMAX + NXMIN)/2*BR);
    B.cy = Math.round(A.cy + RA*SQ + ICH/2 + 12 + spare*0.35 + CT - NYMIN*BR*CSQ);
  }

  function vertPt(v, t){
    var B = SYS[1];
    return { x: B.cx + v.nx*B.r + Math.sin(t*0.42 + v.ph)*4.5,
             y: B.cy + v.ny*B.r*CSQ + Math.cos(t*0.33 + v.ph*1.7)*3.5, d: 0 };
  }
  function orbPt(st, t){
    var S = SYS[0], a = st.a0 + S.spd*t;
    return { x: S.cx + Math.cos(a)*S.r, y: S.cy + Math.sin(a)*S.r*SQ, d: Math.sin(a) };
  }
  function basePt(st, t){ return st.sys ? vertPt(st.vert, t) : orbPt(st, t); }

  function sendTo(st, ox, oy, dur){
    var d = Math.hypot(ox, oy) || 1;
    st.off = { x:ox, y:oy };
    st.nx = -oy/d; st.ny = ox/d;
    st.arc = Math.min(115, d*0.30) * (ox < 0 ? -1 : 1);
    st.t0 = nowT(); st.dur = dur || 880;
    st.el.classList.add("ret");
  }

  function glide(fn, dur, stagger){
    var pre = SAT.map(function(st){ return basePt(st, tNow); });
    if(fn) fn();
    SAT.forEach(function(st, i){
      var p = basePt(st, tNow);
      sendTo(st, pre[i].x - p.x, pre[i].y - p.y, dur);
      if(stagger) st.t0 += i*stagger;
    });
  }

  function bloom(){
    SAT.forEach(function(st, i){
      var S = SYS[st.sys], p = basePt(st, tNow);
      sendTo(st, S.cx - p.x, S.cy - p.y, 1000);
      st.arc = (i%2 ? 1 : -1) * 26;
      st.t0 += 60 + i*72;
    });
  }

  function targetSpeed(){
    if(dragging) return 0;
    if(hoverN > 0) return .05;
    var n = 0; for(var k in open){ if(!open[k].mini) n++; }
    return n ? .42 : 1;
  }

  function place(st, now){
    var p = basePt(st, tNow), ox = 0, oy = 0;
    st.dep = p.d;
    var sc = st.sys ? 1 : 1 + p.d*.07;
    var op = st.sys ? 1 : .86 + (p.d+1)/2*.14;
    if(st.drag){ ox = st.dx; oy = st.dy; sc = 1.08; op = 1; }
    else if(st.off){
      var k = (now - st.t0)/st.dur;
      if(k >= 1){ st.off = null; st.el.classList.remove("ret"); }
      else{
        if(k < 0) k = 0;
        var e = 1 - Math.pow(2, -9*k)*Math.cos(k*5.2), f = 1 - e;
        var arc = Math.sin(Math.min(1,k)*Math.PI)*st.arc;
        ox = st.off.x*f + st.nx*arc;
        oy = st.off.y*f + st.ny*arc;
      }

    st.px = p.x + ox; st.py = p.y + oy;
    var yoff = st.sys ? 29 : ICH/2;   /* constellation folders hang from the tile centre */
    st.el.style.transform = "translate3d("+(st.px-ICW/2).toFixed(1)+"px,"

    st.el.style.opacity = op.toFixed(3);
    st.el.style.zIndex = st.drag ? 40 : (14 + Math.round(p.d*8));
  }

    var B = SYS[1];

      if(q){ v.cx = q.px; v.cy = q.py; }
      else { var pt = vertPt(v, tNow); v.cx = pt.x; v.cy = pt.y;
             v.el.setAttribute("cx", v.cx.toFixed(1)); v.el.setAttribute("cy", v.cy.toFixed(1)); }
    });

       CK42BB/procedural-stars-threejs  (c) 2026 Kingsley
         magnitude to brightness (2.512^-m), the three-frequency twinkle that
         bright stars resist, the core+glow star profile with a diffraction
         hint, and the milky way as band * structure * (1 - dust) + core.

  var NIGHT = (function(){
    var gal = $("gal"), fine = $("fine"), mwc = $("mwc"), stc = $("stc"), btn = $("thbtn");

    var sctx = stc.getContext("2d"), fctx = fine.getContext("2d"), mctx = mwc.getContext("2d");
    var lbl = btn.querySelector("span");
    var root = document.documentElement;
    var on = root.getAttribute("data-theme") === "night";
    var W = 0, H = 0, DPR = 1, t0 = 0, shoot = null, nextShoot = 0, still = false;
    var pointerX = null, pointerY = null;
    var mwPending = 0, mwRows = 0, mwImg = null, mwW = 0, mwH = 0, rzT = 0;
    var mx = 0, my = 0, px = 0, py = 0;

    function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

               [1.15,255,205,161],[1.60,255,180,124]];

    var cache = {};

      var key = rgb[0]+","+rgb[1]+","+rgb[2]+(spike?"+":"");
      if(cache[key]) return cache[key];
      var S = 48, c = document.createElement("canvas"), x = c.getContext("2d");
      c.width = c.height = S;
      var img = x.createImageData(S, S), d = img.data, hh = (S-1)/2;

       band is. A milky way is not a painted smear, it is a density of stars,

    var AX = 0.40, AY = 1.0, AL = Math.sqrt(AX*AX + AY*AY);

       Nothing here is invented. Every point is a catalogued star at its own
       place, with its own magnitude and its own colour index, and every line
       is the figure astronomers actually draw. The Plough is no longer a
       shape on its own: it sits inside Draco, Bootes, Canes Venatici, Leo
       Minor, Lynx and twenty more, exactly as it does overhead.

       Stars are drawn as point sources, not as little spheres. No star but
       the sun is resolvable from here, so what a star gives you is a core,
       a glare, and diffraction spikes if it is bright enough. */
    var FIELD_BRIGHT = 4.1;          /* brighter than this twinkles every frame */
    var field = [], fieldLive = [], figs = [], conNames = [];
