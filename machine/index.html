    function starSize(mag){ return 1.10 + 7.60*Math.pow(starLum(mag), 0.33); }
    function starAlpha(mag){ return clamp(0.30 + 2.20*Math.pow(starLum(mag), 0.38), 0, 1); }

    function parseSky(){
      if(field.length) return;
      var rows = SKYDATA.stars.split(" ");
      for(var i=0;i<rows.length;i++){
        var v = rows[i].split(",");
        var mag = (+v[2])/20, bv = (+v[3])/50;
        var s = { x:(+v[0])/1000, y:(+v[1])/1000, mag:mag,
                  ph: ((i*2654435761) % 6283)/1000,
                  img: sprite(bv2rgb(bv), mag < 2.2) };
        field.push(s);
        if(mag <= FIELD_BRIGHT) fieldLive.push(s);
      }
      var fs = SKYDATA.figs.split("|");
      for(i=0;i<fs.length;i++){
        var c = fs[i].indexOf(":"), id = fs[i].slice(0, c);
        var parts = fs[i].slice(c+1).split(";"), poly = [];
        for(var j=0;j<parts.length;j++){
          var n = parts[j].split(","), pts = [];
          for(var k=0;k<n.length;k+=2) pts.push([(+n[k])/1000, (+n[k+1])/1000]);
          poly.push(pts);
        }
        figs.push({ id:id, poly:poly });
      }
      var ns = SKYDATA.names.split("|");
      for(i=0;i<ns.length;i++){
        var p = ns[i].split(",");
        conNames.push({ id:p[0], x:(+p[1])/1000, y:(+p[2])/1000, name:p[3].toLowerCase() });
      }
    }

    /* the asterism hangs off the folders on every screen, phones included */
    function frameB(){ return SYS[1]; }
    function sx(nx){ var B = frameB(); return B.cx + nx*B.r; }
    function sy(ny){ var B = frameB(); return B.cy + ny*B.r*CSQ; }

    /* the faint field never changes, so it is painted once per layout */
    function paintFine(){
      var B = frameB();
      if(!B || !B.r) return;
      fine.width = Math.round(W*DPR); fine.height = Math.round(H*DPR);
      fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      fctx.clearRect(0, 0, W, H);
      fctx.globalCompositeOperation = "lighter";
      for(var i=0;i<field.length;i++){
        var s = field[i];
        if(s.mag <= FIELD_BRIGHT) continue;
        var x = sx(s.x), y = sy(s.y);
        if(x < -20 || x > W+20 || y < -20 || y > H+20) continue;
        var d = starSize(s.mag)*4.4;
        fctx.globalAlpha = starAlpha(s.mag);
        fctx.drawImage(s.img, x - d/2, y - d/2, d, d);
      }
      fctx.globalAlpha = 1;
      fctx.globalCompositeOperation = "source-over";
    }

    /* the figures of the neighbouring constellations, and their names, which
       surface only where the pointer is looking */
    function drawFigs(){
      var B = frameB();
      if(!B || !B.r) return;
      var mxp = pointerX, myp = pointerY;
      sctx.lineCap = "round"; sctx.lineJoin = "round";
      for(var i=0;i<figs.length;i++){
        var f = figs[i], nm = null;
        for(var j=0;j<conNames.length;j++) if(conNames[j].id === f.id){ nm = conNames[j]; break; }
        var near = 0;
        if(nm && mxp != null){
          var d = Math.hypot(sx(nm.x) - mxp, sy(nm.y) - myp);
          near = 1 - clamp((d - 90)/190, 0, 1);
        }
        if(f.id === "UMa") continue;          /* the plough is drawn in svg, it follows the folders */
        sctx.strokeStyle = "rgba(174,202,248," + (0.115 + near*0.34).toFixed(3) + ")";
        sctx.lineWidth = 0.75 + near*0.35;
        for(j=0;j<f.poly.length;j++){
          var pts = f.poly[j];
          sctx.beginPath();
          for(var k=0;k<pts.length;k++){
            var x = sx(pts[k][0]), y = sy(pts[k][1]);
            if(k) sctx.lineTo(x, y); else sctx.moveTo(x, y);

          sctx.globalAlpha = near*0.8;
          sctx.fillStyle = "#9FB0CE";
          sctx.font = '9px "JetBrains Mono", ui-monospace, monospace';
          try{ sctx.letterSpacing = "2px"; }catch(e){}
          sctx.textAlign = "center";
          sctx.fillText(nm.name, sx(nm.x), sy(nm.y));
          try{ sctx.letterSpacing = "0px"; }catch(e){}
          sctx.globalAlpha = 1;
        }

    /* the bright field: these are the ones the eye sees scintillate */
    function drawField(now, ign){
      var B = frameB();
      if(!B || !B.r) return;
      var t = reduce ? 0 : now/1000;
      sctx.globalCompositeOperation = "lighter";
      for(var i=0;i<fieldLive.length;i++){
        var s = fieldLive[i];
        var x = sx(s.x), y = sy(s.y);
        if(x < -30 || x > W+30 || y < -30 || y > H+30) continue;
        var tw = 1 + Math.sin(t*1.5 + s.ph)*0.14
                   + Math.sin(t*3.6 + s.ph*2)*0.07
                   + Math.sin(t*7.0 + s.ph*3)*0.035;
        var a = clamp(starAlpha(s.mag)*tw, 0, 1)*ign;
        var d = starSize(s.mag)*tw*4.4;
        sctx.globalAlpha = a;
        sctx.drawImage(s.img, x - d/2, y - d/2, d, d);
      }
      sctx.globalAlpha = 1;
    }

    /* the seven, and the companion that is really there */
    function drawCon(ign, t){
      var B = frameB();
      if(!B || !B.r) return;
      sctx.globalCompositeOperation = "lighter";
      for(var i=0;i<VERT.length;i++){
        var v = VERT[i];
        if(v.cx == null || v.mag == null) continue;
        /* the shape lights up from the tip of the handle down to the pointers */
        var lit = clamp((ign*1.75 - (VERT.length-1-i)*0.085)/0.34, 0, 1);
        if(lit <= 0) continue;
        if(!v.img) v.img = sprite(bv2rgb(v.bv), true);
        var tw = 1 + Math.sin(t*1.5 + v.ph)*0.10 + Math.sin(t*3.6 + v.ph*2)*0.05;
        var d = starSize(v.mag)*tw*7.2;
        sctx.globalAlpha = clamp(starAlpha(v.mag)*tw, 0, 1)*lit;
        sctx.drawImage(v.img, v.cx - d/2, v.cy - d/2, d, d);
        /* Mizar and Alcor really are a naked-eye pair twelve arcminutes apart.
           At this scale that is about three pixels, so it is drawn true: a
           tight companion you only notice if you look. */

          var A = SKYDATA.alcor;
          var ax = v.cx + (A[0] - v.nx)*B.r, ay = v.cy + (A[1] - v.ny)*B.r*CSQ;
          if(!alcImg) alcImg = sprite(bv2rgb(A[3]), false);
          var ad = starSize(A[2])*5.4;
          sctx.globalAlpha = clamp(starAlpha(A[2]), 0, 1)*lit;
          sctx.drawImage(alcImg, ax - ad/2, ay - ad/2, ad, ad);
          var lab = skyEl2 && skyEl2.classList.contains("near") ? lit*0.72 : 0;
          alcorLbl.setAttribute("x", (ax + 15).toFixed(0));
          alcorLbl.setAttribute("y", (ay - 6).toFixed(0));
          alcorLbl.style.opacity = lab.toFixed(2);
        }

    }
    var alcImg = null;

    /* ---- the sky, coded ---------------------------------------------------
       No photograph. The backdrop is three nebula layers and nothing else,
       and each layer is one colour, one intensity, one falloff.

       The method is wwwtyro/space-3d (Unlicense, public domain): instead of
       stacking octaves, feed the noise its own output six times over, each
       round at half the scale. That one loop is what turns fog into wisps.
       The falloff exponent then throws away everything but the densest part,
       which is why it reads as clean structure rather than grey haze.

       Drawn once per resize at half device resolution. A nebula has no sharp
       edge to lose, and the stars that do need edges are point sources drawn
       on their own canvas above this one. */

    "precision highp float;",
    "uniform vec2 uRes;",
    /* a hash with no trigonometry in it, after Dave Hoskins */
    "vec3 h33(vec3 p){",
    "  p=fract(p*vec3(0.1031,0.1030,0.0973));",
    "  p+=dot(p,p.yxz+33.33);",
    "  return fract((p.xxy+p.yxx)*p.zyx)*2.0-1.0;",

    "  vec3 i=floor(p),f=fract(p);",
    "  vec3 u=f*f*(3.0-2.0*f);",
    "  return mix(mix(mix(dot(h33(i+vec3(0,0,0)),f-vec3(0,0,0)),",
    "                     dot(h33(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),",
    "                 mix(dot(h33(i+vec3(0,1,0)),f-vec3(0,1,0)),",
    "                     dot(h33(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),",
    "             mix(mix(dot(h33(i+vec3(0,0,1)),f-vec3(0,0,1)),",
    "                     dot(h33(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),",
    "                 mix(dot(h33(i+vec3(0,1,1)),f-vec3(0,1,1)),",
    "                     dot(h33(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);",

    "float n3(vec3 p){ return gn(p)*0.5+0.5; }",
    /* space-3d's nebula, verbatim in structure */
    "float neb(vec3 p){",
    "  float scale=32.0;",
    "  vec3 d=vec3(0.0);",
    "  for(int i=0;i<5;i++){",
    "    d=vec3(n3(p.xyz*scale+d), n3(p.yzx*scale+d), n3(p.zxy*scale+d));",
    "    scale*=0.5;",
    "  }",
    "  return n3(p*scale+d);",
    "}",
    "float layer(vec3 dir,vec3 off,float sc,float inten,float fall){",
    "  float c=min(1.0,neb(normalize(dir)*sc+off)*inten);",
    "  return pow(c,fall);",
    "}",
    "void main(){",
    "  vec2 uv=gl_FragCoord.xy/uRes;",
    "  float asp=uRes.x/uRes.y;",
    /* look out of a box, so the structure is three-dimensional and seamless */
    "  vec3 dir=normalize(vec3((uv-0.5)*vec2(asp,1.0)*1.5, 1.0));",

    /* composition: the clouds live on the left, the asterism keeps a clean
       corner on the right. one mask, no per-layer fiddling. */
    "  float room=1.0-smoothstep(0.34,0.96,uv.x*0.72+uv.y*0.46);",
    "  room=0.14+0.86*room;",

    "  vec3 col=vec3(0.0);",
    "  col+=vec3(0.24,0.34,0.72)*layer(dir,vec3( 0.0, 0.0, 0.0),2.2,1.34,3.0)*1.25*room;",
    "  col+=vec3(0.16,0.52,0.60)*layer(dir,vec3(17.0, 5.0,11.0),2.9,1.20,4.2)*0.72*room;",
    "  col+=vec3(0.80,0.42,0.20)*layer(dir,vec3(41.0,23.0, 7.0),3.6,1.12,5.6)*0.52*room;",

    "  float a=clamp(max(col.r,max(col.g,col.b))*1.9,0.0,1.0);",
    "  gl_FragColor=vec4(col,a);",

    var gl = null, glProg = null, glOK = false;
    function glInit(){

        gl.shaderSource(s, src); gl.compileShader(s);
        return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;

      gl.attachShader(glProg, vs); gl.attachShader(glProg, fs);
      gl.linkProgram(glProg);
      if(!gl.getProgramParameter(glProg, gl.LINK_STATUS)) return false;

      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(glProg, "a");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      glOK = true;
      return true;

         so there is nothing to gain from painting it per device pixel */
      var s = Math.min(DPR, 2)*(MOB ? 0.34 : 0.50), w = Math.round(W*s), hh = Math.round(H*s);
      var MAXPX = 1400000;
      if(w*hh > MAXPX){ var f = Math.sqrt(MAXPX/(w*hh)); w = Math.round(w*f); hh = Math.round(hh*f); }
      gal.width = w; gal.height = hh;
      gl.viewport(0, 0, w, hh);
      gl.uniform2f(gl.getUniformLocation(glProg, "uRes"), w, hh);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return true;
    }

    /* ---- the solar system ------------------------------------------------
       In night the desktop stops being a desktop. The centre is a star, the
       five project folders are the planets that orbit it, and each one is a
       different world: rock, ocean, two gas giants, ice.

       Every body is one quad drawn by a shared fragment shader, so the whole
       system is a handful of draw calls on one webgl context.

       The light direction is not a constant. It is computed per planet from
       where that planet actually is on its orbit, which means the phases are
       real: a planet on the near side of the sun shows a crescent, one on the
       far side shows a full disc.

       Surface work follows the layered-noise scheme in
       XenoverseUp/procedural-planets (MIT): a warped continent layer, ridged
       detail on top, then colour ramps by elevation, plus that project's
       atmosphere term pow(k - dot(n,v), 2) for the limb. */
    var BODY = {
      readme:   { t:0, rad:52, spin:0.030, tilt:0.00, seed: 3.1, pad:2.40 },
      istakip:  { t:5, rad:22, spin:0.100, tilt:0.30, seed:71.0, pad:2.55 },
      reporting:{ t:3, rad:27, spin:0.085, tilt:0.14, seed:37.0, pad:1.45 },
      pipeline: { t:2, rad:20, spin:0.120, tilt:0.22, seed:23.0, pad:1.45 },
      sms:      { t:4, rad:18, spin:0.140, tilt:0.40, seed:53.0, pad:1.45 },
      karinca:  { t:1, rad:16, spin:0.165, tilt:0.28, seed:11.0, pad:1.45 }
    };

    var BVS = [
    "attribute vec2 a;",
    "uniform vec2 uRes; uniform vec2 uC; uniform float uPad;",
    "varying vec2 vP;",
    "void main(){",
    "  vP=a*uPad;",
    "  vec2 px=uC+vP;",
    "  gl_Position=vec4(px.x/uRes.x*2.0-1.0, 1.0-px.y/uRes.y*2.0, 0.0, 1.0);",
    "}"].join("\n");

    var BFS = [
    "precision highp float;",
    "uniform float uR,uPad,uT,uTilt,uSeed,uDim;",
    "uniform vec3 uTint;",
    "uniform vec3 uL;",
    "uniform int uType;",
    "varying vec2 vP;",
    "float h31(vec3 p){",
    "  p=fract(p*0.3183099+vec3(0.1,0.2,0.3)); p*=17.0;",
    "  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));",
    "}",
    "float n3(vec3 x){",
    "  vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);",
    "  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),",
    "                 mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),",
    "             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),",
    "                 mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);",
    "}",
    "float fb(vec3 p,int oct){",
    "  float s=0.0,a=0.5,m=0.0;",
    "  for(int i=0;i<6;i++){ if(i>=oct)break; s+=n3(p)*a; m+=a; a*=0.5; p=p*2.04+1.7; }",
    "  return s/m;",
    "}",
    "float rg(vec3 p,int oct){",
    "  float s=0.0,a=0.5,m=0.0;",
    "  for(int i=0;i<6;i++){ if(i>=oct)break;",
    "    float n=1.0-abs(n3(p)*2.0-1.0); s+=n*n*a; m+=a; a*=0.5; p=p*2.06+3.1; }",
    "  return s/m;",
    "}",
    "float f2(vec2 p,int oct){ return fb(vec3(p,0.7),oct); }",
    "vec3 rotY(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z); }",
    "vec3 rotX(vec3 p,float a){ float c=cos(a),s=sin(a); return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z); }",
    "void main(){",
    "  vec2 uv=vP/uR;",
    "  float r2=dot(uv,uv), r=sqrt(r2);",

    /* ---------------- the star ---------------- */
    "  if(uType==0){",
    /* one star shader for every star. uTint is the body colour, taken from the
       real B-V index, so Dubhe comes out orange and Alkaid comes out blue.
       Squaring the tint deepens it for the cool limb; mixing it toward white
       gives the hot core. */
    "    vec3 cLo=uTint*uTint*1.10;",
    "    vec3 cHi=mix(uTint,vec3(1.0),0.74);",
    "    if(r<=1.0){",
    "      float z=sqrt(max(0.0,1.0-r2));",
    "      vec3 P=rotX(rotY(vec3(uv,z),uT),0.28);",
    /* granulation: convection cells, two scales */
    "      float g=fb(P*6.2+uSeed,4), g2=fb(P*17.0+uSeed+9.0,3);",
    "      float s=0.58+g*0.46+g2*0.22;",
    /* limb darkening: a star is dimmer at its edge, and this is the single",
       cue that makes a flat disc read as a sphere of gas */
    "      float ld=0.38+0.62*pow(z,0.42);",
    "      float e=s*ld;",
    "      vec3 c=mix(cLo,uTint,smoothstep(0.26,0.70,e));",
    "      c=mix(c,cHi,smoothstep(0.80,1.16,e));",
    "      gl_FragColor=vec4(c*(0.46+e*1.00)*uDim,uDim);",
    "      return;",
    "    }",
    "    float d=r-1.0;",
    "    float ang=atan(uv.y,uv.x);",
    /* the corona is not a smooth halo, it has streamers */
    "    float ray=0.52+0.48*f2(vec2(ang*3.4,d*2.2+uT*1.6),3);",
    "    float glow=exp(-d*3.6)*ray+exp(-d*11.0)*0.85;",
    "    gl_FragColor=vec4(uTint*glow*1.75*uDim,clamp(glow*1.2,0.0,1.0)*uDim);",
    "    return;",
    "  }",

    /* ---------------- rings, for the one that has them ---------------- */
    "  float ringA=0.0; vec3 ringC=vec3(0.0);",
    "  if(uType==5){",
    "    float rr=length(vec2(uv.x,uv.y/0.30));",
    "    if(rr>1.34 && rr<2.28){",
    "      float t=(rr-1.34)/0.94;",
    "      float dens=smoothstep(0.30,0.74,f2(vec2(rr*15.0,uSeed),3));",
    "      dens*=smoothstep(0.015,0.085,abs(t-0.44));",   /* a division in the ring */
    "      dens*=smoothstep(0.0,0.10,t)*smoothstep(1.0,0.84,t);",
    "      ringA=dens*0.78;",
    "      ringC=mix(vec3(0.58,0.50,0.37),vec3(0.90,0.83,0.68),dens);",
    "      ringC*=0.30+0.80*clamp(uL.z*0.5+0.62,0.0,1.0);",
    "    }",
    "  }",
    "  if(r>1.0){",
    "    if(ringA>0.0){ gl_FragColor=vec4(ringC,ringA); return; }",
    "    discard;",
    "  }",

    /* ---------------- the worlds ---------------- */
    "  float z=sqrt(max(0.0,1.0-r2));",
    "  vec3 N=vec3(uv,z);",
    "  vec3 P=rotX(rotY(N,uT),uTilt);",
    "  vec3 col;",
    "  if(uType==1){",                          /* rust and rock */
    "    float h=fb(P*3.1+uSeed,5);",
    "    float m=rg(P*7.4+uSeed,4);",
    "    col=mix(vec3(0.30,0.13,0.08),vec3(0.68,0.38,0.20),h);",
    "    col=mix(col,vec3(0.76,0.57,0.38),smoothstep(0.55,0.95,m)*0.55);",
    "    col=mix(col,vec3(0.88,0.88,0.90),smoothstep(0.87,0.98,abs(P.y)+fb(P*9.0,2)*0.06));",
    "  } else if(uType==2){",                   /* an ocean with a little land */
    "    vec3 w=vec3(fb(P*1.3+2.0,3),fb(P*1.3+8.0,3),fb(P*1.3+14.0,3))-0.5;",
    "    float h=(fb(P*2.4+w*1.6+uSeed,5)-0.605)*1.95;",
    "    float land=smoothstep(0.0,0.025,h);",
    "    vec3 sea=mix(vec3(0.015,0.060,0.185),vec3(0.045,0.235,0.395),smoothstep(-0.24,0.0,h));",
    "    vec3 gnd=mix(vec3(0.19,0.31,0.17),vec3(0.46,0.42,0.29),smoothstep(0.02,0.13,h));",
    "    col=mix(sea,gnd,land);",
    "    float cl=smoothstep(0.545,0.815,fb(P*3.1+40.0,4));",
    "    col=mix(col,vec3(0.92,0.95,0.99),cl*0.58);",
    "    col=mix(col,vec3(0.90,0.94,0.97),smoothstep(0.85,0.97,abs(P.y)));",
    "  } else if(uType==3||uType==5){",         /* banded giants */
    "    float turb=fb(P*3.2+uSeed,4);",
    "    float b=sin((P.y*3.0+turb*0.62)*5.6)*0.5+0.5;",
    "    vec3 c1,c2;",
    "    if(uType==3){ c1=vec3(0.26,0.32,0.48); c2=vec3(0.70,0.75,0.84); }",
    "    else        { c1=vec3(0.44,0.31,0.16); c2=vec3(0.86,0.76,0.55); }",
    "    col=mix(c1,c2,b);",
    "    col=mix(col,c2*1.12,smoothstep(0.58,0.96,turb)*0.40);",
    /* one long-lived storm, the way a real giant has one */
    "    float lon=atan(P.x,P.z);",
    "    vec2 dd=vec2(sin(lon-1.15)*1.15,(P.y+0.21)*2.9);",
    "    col=mix(col,vec3(0.82,0.40,0.26),exp(-dot(dd,dd)*5.5)*0.78);",
    "  } else {",                               /* ice, cracked */
    "    float cr=rg(P*5.2+uSeed,4);",
    "    col=mix(vec3(0.50,0.61,0.73),vec3(0.87,0.93,0.98),fb(P*2.7+uSeed,4));",
    "    col=mix(col,vec3(0.38,0.53,0.69),smoothstep(0.60,0.95,cr)*0.75);",
    "  }",
    "  float nl=dot(N,uL);",
    "  float day=smoothstep(-0.13,0.30,nl);",
    /* the unlit side keeps a floor of light, so a planet on the near side of
       the star still reads as a world and not as a hole in the sky */
    "  col*=0.28+0.72*day;",
    "  float limb=pow(1.0-z,2.1)*smoothstep(-0.26,0.62,nl);",
    /* a cold edge so the silhouette still reads when the world is unlit */
    "  col+=vec3(0.15,0.21,0.35)*pow(1.0-z,3.0)*0.60;",
    "  if(uType==2) col+=vec3(0.34,0.58,1.0)*limb*1.05;",
    "  else if(uType==4) col+=vec3(0.52,0.70,1.0)*limb*0.70;",
    "  else col+=vec3(0.42,0.50,0.74)*limb*0.45;",
    "  if(ringA>0.0&&uv.y>0.0) col=mix(col,ringC,ringA);",
    "  gl_FragColor=vec4(col,1.0);",
    "}"].join("\n");

    var bgl = null, bProg = null, bOK = false, bU = {}, sunHot = false;
    var CT = Math.sqrt(1 - SQ*SQ);          /* how much of the orbit tips toward us */
    function bInit(){
      if(!sys) return false;
      try{
        bgl = sys.getContext("webgl", { alpha:true, premultipliedAlpha:false,
                                        antialias:true, depth:false, stencil:false });
      }catch(e){ bgl = null; }
      if(!bgl) return false;
      function sh(t, src){
        var s = bgl.createShader(t);
        bgl.shaderSource(s, src); bgl.compileShader(s);
        return bgl.getShaderParameter(s, bgl.COMPILE_STATUS) ? s : null;
      }
      var vs = sh(bgl.VERTEX_SHADER, BVS), fs = sh(bgl.FRAGMENT_SHADER, BFS);
      if(!vs || !fs) return false;
      bProg = bgl.createProgram();
      bgl.attachShader(bProg, vs); bgl.attachShader(bProg, fs);
      bgl.linkProgram(bProg);
      if(!bgl.getProgramParameter(bProg, bgl.LINK_STATUS)) return false;
      bgl.useProgram(bProg);
      var b = bgl.createBuffer();
      bgl.bindBuffer(bgl.ARRAY_BUFFER, b);
      bgl.bufferData(bgl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), bgl.STATIC_DRAW);
      var loc = bgl.getAttribLocation(bProg, "a");
      bgl.enableVertexAttribArray(loc);
      bgl.vertexAttribPointer(loc, 2, bgl.FLOAT, false, 0, 0);
      ["uRes","uC","uR","uPad","uT","uTilt","uSeed","uL","uType","uTint","uDim"].forEach(function(n){
        bU[n] = bgl.getUniformLocation(bProg, n);
      });
      bgl.enable(bgl.BLEND);
      bgl.blendFunc(bgl.SRC_ALPHA, bgl.ONE_MINUS_SRC_ALPHA);
      bOK = true;
      document.body.classList.add("sysgl");
      return true;
    }

    /* the light on a planet points at the star, through the tilted orbit */
    function lightFor(sx, sy){
      var X = sx, Z = sy/SQ, m = Math.sqrt(X*X + Z*Z);
      if(m < 0.0001) return [0, 0, 1];
      var nx = -X/m, nz = -Z/m;
      return [nx, -SQ*nz, CT*nz];
    }

    function bSize(){
      var w = Math.round(W*DPR), hh = Math.round(H*DPR);
      if(sys.width !== w || sys.height !== hh){
        sys.width = w; sys.height = hh;
        bgl.viewport(0, 0, w, hh);
      }
      bgl.uniform2f(bU.uRes, sys.width, sys.height);
    }
    var SUNTINT = [1.0, 0.62, 0.22];
    function drawBody(b, x, y, rad, L, spinT, tint, dim){
      bgl.uniform2f(bU.uC, x*DPR, y*DPR);
      bgl.uniform1f(bU.uR, rad*DPR);
      bgl.uniform1f(bU.uPad, rad*b.pad*DPR);
      bgl.uniform1f(bU.uT, spinT);
      bgl.uniform1f(bU.uTilt, b.tilt);
      bgl.uniform1f(bU.uSeed, b.seed);
      bgl.uniform3f(bU.uL, L[0], L[1], L[2]);
      bgl.uniform1i(bU.uType, b.t);
      tint = tint || SUNTINT;
      bgl.uniform3f(bU.uTint, tint[0], tint[1], tint[2]);
      bgl.uniform1f(bU.uDim, dim == null ? 1 : dim);
      bgl.drawArrays(bgl.TRIANGLE_STRIP, 0, 4);
    }

    /* the seven of the plough, drawn by the same shader as the sun, each one
       sized by its real magnitude and coloured by its real B-V index */
    var curIgn = 0;
    function drawSystem(now){
      if(!bOK || !W) return;
      bSize();
      bgl.clearColor(0, 0, 0, 0);
      bgl.clear(bgl.COLOR_BUFFER_BIT);
      var S = SYS[0], t = reduce ? 40 : now/1000;
      /* the sun matches the planet it stands in for, which is smaller on a
         phone; the worlds shrink less, so they stay readable next to it */
      var ks = (S.box || 176)/176, kp = Math.sqrt(ks);

      /* the star first: nothing on this orbit ever passes in front of it */
      var sunB = BODY.readme;
      drawBody(sunB, S.cx, S.cy, sunB.rad*ks*(sunHot ? 1.05 : 1),
               [0,0,1], t*sunB.spin, SUNTINT, 1);

      /* then the planets, far side first, so a nearer one can cover it */
      var ord = [];
      for(var i=0;i<SAT.length;i++){
        var st = SAT[i];
        if(st.sys !== 0 || !BODY[st.id] || st.px == null) continue;
        if(st.toff == null) continue;
        ord.push(st);
      }
      ord.sort(function(p, q){ return (p.py - S.cy) - (q.py - S.cy); });
      for(i=0;i<ord.length;i++){
        var s2 = ord[i], b = BODY[s2.id];
        var sc = 1 + (s2.dep || 0)*0.07;
        var cy = s2.py + s2.toff*sc;
        drawBody(b, s2.px, cy, b.rad*kp*sc,
                 lightFor(s2.px - S.cx, s2.py - S.cy), t*b.spin + b.seed, null, 1);
      }
    }

    /* ---- 2d fallback, used only where webgl is unavailable ---- */
    function hash2(x, y){ var s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
    function vnoise(x, y){
      var ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
      fx = fx*fx*(3-2*fx); fy = fy*fy*(3-2*fy);
      var a = hash2(ix,iy), b = hash2(ix+1,iy), c = hash2(ix,iy+1), d = hash2(ix+1,iy+1);
      var t = a + (b-a)*fx;
      return t + ((c + (d-c)*fx) - t)*fy;
    }
    function fbm2(x, y, oct){
      var s = 0, amp = 1, m = 0;
      for(var i=0;i<oct;i++){ s += vnoise(x,y)*amp; m += amp; amp *= 0.5; x *= 2.1; y *= 2.1; }
      return s/m;
    }
    function mwStart(){
      mwW = 340;
      mwH = clamp(Math.round(mwW * (H/Math.max(1,W))), 120, 260);
      mwc.width = mwW; mwc.height = mwH;
      mwImg = mctx.createImageData(mwW, mwH);
      mwRows = 0;
      if(mwPending) cancelAnimationFrame(mwPending);
      mwStep();
    }
    function mwStep(){
      var d = mwImg.data, rows = Math.min(mwH, mwRows + 26);
      for(var j=mwRows;j<rows;j++){
        var v = j/mwH;
        for(var i=0;i<mwW;i++){
          var u = i/mwW, qx = u - 0.13, qy = v;
          var lon = qx*AX + qy*AY, lat = qx*AY - qy*AX;
          var o = (j*mwW+i)*4;
          var band = Math.exp(-lat*lat/0.0182);
          if(band < 0.004){ d[o+3] = 0; continue; }
          var st   = fbm2(lon*5.0, lat*11.0, 5)*0.74 + 0.26;
          var dust = sstep(0.35, 0.55, fbm2(lon*8.5+1.7, lat*34.0+1.7, 4))*0.72;
          var core = Math.exp(-(lon-0.82)*(lon-0.82)*3.2)*0.58;
          var mw   = band*st*(1-dust) + core*band;
          var k    = clamp(core*2.1 + 0.16, 0, 1);
          var sn   = Math.pow(vnoise(lon*260, lat*260), 9)*band;
          d[o]   = Math.round(clamp(86  + (252-86 )*k + sn*160, 0, 255));
          d[o+1] = Math.round(clamp(110 + (208-110)*k + sn*160, 0, 255));
          d[o+2] = Math.round(clamp(178 + (150-178)*k + sn*160, 0, 255));
          d[o+3] = Math.round(clamp(mw*0.31 + sn*0.34, 0, 1)*255);
        }
      }
      mctx.putImageData(mwImg, 0, 0);
      mwRows = rows;
      mwPending = mwRows < mwH ? requestAnimationFrame(mwStep) : 0;
    }

    /* the alcor label is svg; alcor itself is a point source like any star */
    var alcorLbl = document.createElementNS(NS, "text");
    alcorLbl.setAttribute("class", "cal");
    alcorLbl.textContent = "alcor";
    conG.appendChild(alcorLbl);

    /* ---- a meteor now and then, never two at once ---- */
    function drawShoot(now){
      if(!shoot){
        if(nextShoot > 0 && now > nextShoot){
          shoot = { x: W*(0.18 + Math.random()*0.72), y: -30,
                    vx: -(150 + Math.random()*140), vy: (120 + Math.random()*110),
                    t0: now, life: 820 + Math.random()*460 };
        }
        return;
      }
      var e = (now - shoot.t0)/1000, k = (now - shoot.t0)/shoot.life;
      if(k >= 1){ shoot = null; nextShoot = now + 17000 + Math.random()*30000; return; }
      var x = shoot.x + shoot.vx*e, y = shoot.y + shoot.vy*e;
      var L = Math.sqrt(shoot.vx*shoot.vx + shoot.vy*shoot.vy);
      var ux = shoot.vx/L, uy = shoot.vy/L, len = 108, a = Math.sin(k*Math.PI);
      var g = sctx.createLinearGradient(x, y, x - ux*len, y - uy*len);
      g.addColorStop(0, "rgba(255,255,255," + (a*0.85).toFixed(3) + ")");
      g.addColorStop(0.35, "rgba(200,220,255," + (a*0.28).toFixed(3) + ")");
      g.addColorStop(1, "rgba(160,190,255,0)");
      sctx.strokeStyle = g; sctx.lineWidth = 1.5; sctx.lineCap = "round";
      sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - ux*len, y - uy*len); sctx.stroke();
    }

    function tick(now){
      if(!on || !W) return;
      var ign = reduce ? 1 : clamp((now - t0)/1400, 0, 1);
      curIgn = ign;
      px += (mx - px)*0.06; py += (my - py)*0.06;
      /* under reduced motion the star canvas is painted once and left alone,
         but the bodies still follow their folders, so they are never frozen */
      if(reduce && still){ drawSystem(now); return; }
      still = reduce;
      sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      sctx.clearRect(0, 0, W, H);
      var t = reduce ? 0 : now/1000;
      drawField(now, ign);
      drawFigs();
      drawCon(ign, t);
      sctx.globalCompositeOperation = "lighter";
      if(!reduce) drawShoot(now);
      sctx.globalCompositeOperation = "source-over";
      drawSystem(now);
      sctx.globalCompositeOperation = "source-over";
      if(!reduce){
        /* the catalogue is the sky itself, anchored to the asterism, so only
           the plate behind it drifts */
        gal.style.transform  = "translate3d(" + (px*0.30).toFixed(1) + "px," + (py*0.30).toFixed(1) + "px,0)";
        if(photoEl) photoEl.style.transform = "translate3d(" + (px*0.22).toFixed(1) + "px," + (py*0.22).toFixed(1) + "px,0)";
      }
    }

    function repaintSky(){
      if(!W) return;
      parseSky();
      paintFine();
      if(SKY === "photo") return;
      if(!glPaint()){ clearTimeout(rzT); rzT = setTimeout(mwStart, 200); }
    }

    /* where the planet sits inside its folder, in layout pixels */
    function measureTiles(){
      for(var i=0;i<SAT.length;i++){
        var st = SAT[i];
        if(st.sys !== 0){ st.el.classList.add("con"); continue; }
        if(!BODY[st.id]) continue;
        st.el.classList.add("sys");
        var tile = st.el.querySelector(".tile");
        if(tile && st.el.offsetHeight) st.toff = tile.offsetTop + tile.offsetHeight/2 - st.el.offsetHeight/2;
      }
    }

    function resize(){
      var b = bounds();
      W = Math.round(b.w); H = Math.round(b.h);
      DPR = Math.min(2, devicePixelRatio || 1);
      stc.width = Math.round(W*DPR); stc.height = Math.round(H*DPR);
      still = false;
      parseSky();
      measureTiles();
      if(on){ clearTimeout(rzT); rzT = setTimeout(repaintSky, 180); }
    }

    function apply(theme){
      on = (theme === "night");
      root.setAttribute("data-theme", theme);
      lbl.textContent = ui(on ? "dayB" : "nightB");
      btn.title = ui(on ? "dayT" : "nightT");
      scopeLabel();
      if(on){
        resize();
        repaintSky();
        t0 = performance.now();
        nextShoot = t0 + 6000;
        still = false;
      }
      if(!on){
        sctx.setTransform(1,0,0,1,0,0);
        sctx.clearRect(0, 0, stc.width, stc.height);
        alcorLbl.style.opacity = 0;
      }
    }

    if(SKY === "photo") document.body.classList.add("photosky");
    if(SKY !== "photo") glInit();
    bInit();
    /* a gpu reset would otherwise leave the galaxy blank until the next resize */
    if(sys){
      sys.addEventListener("webglcontextlost", function(e){
        e.preventDefault(); bOK = false; document.body.classList.remove("sysgl");
      });
      sys.addEventListener("webglcontextrestored", function(){ bOK = false; bgl = null; bInit(); });
    }
    if(coreEl){
      coreEl.addEventListener("pointerenter", function(){ sunHot = true; });
      coreEl.addEventListener("pointerleave", function(){ sunHot = false; });
    }
    gal.addEventListener("webglcontextlost", function(e){ e.preventDefault(); glOK = false; });
    gal.addEventListener("webglcontextrestored", function(){
      glOK = false; gl = null;
      if(glInit() && on) repaintSky();
    });

    btn.addEventListener("click", function(){ toggle(btn); });
    addEventListener("keydown", function(e){
      if(e.metaKey || e.ctrlKey || e.altKey) return;
      if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if(e.key === "n" || e.key === "N") toggle(null);
    });
    function conNear(x, y){
      var B = SYS[1];
      if(!B || !B.r) return false;
      return Math.abs(x - B.cx) < B.r*1.5 + 80 && Math.abs(y - B.cy) < B.r*1.3 + 80;
    }
    deskEl.addEventListener("pointermove", function(e){
      if(!on || MOB || reduce) return;
      var b = deskEl.getBoundingClientRect();
      if(skyEl2) skyEl2.classList.toggle("near", conNear(e.clientX - b.left, e.clientY - b.top));
      pointerX = e.clientX - b.left; pointerY = e.clientY - b.top;
      mx = ((e.clientX - b.left)/b.width - 0.5) * -20;
      my = ((e.clientY - b.top)/b.height - 0.5) * -14;
    });
    /* the names answer the pointer, so they go out when it leaves the desk */
    deskEl.addEventListener("pointerleave", function(){
      pointerX = pointerY = null;
      if(skyEl2) skyEl2.classList.remove("near");
    });
    /* ---------- the telescope ---------------------------------------------
       The night side sits behind one small button in the menu bar, and a
       visitor who is skimming never presses it. So the desk gets a telescope
       in its bottom right corner, on a phone as well, drawn in the
       same orange as the icons but with no box and no label. Every few
       seconds a star flares where it points; pressing it is the same switch
       as N. */
    var SCOPE_SVG =
        '<svg viewBox="-16 -16 32 32" aria-hidden="true">'
      + '<g class="aim">'
      +   '<path class="g" d="M-11.5 -3.3 L5.3 -2.3 L5.3 2.3 L-11.5 3.3 Z"/>'
      +   '<path class="g" d="M5.3 -1.2 H8 V1.2 H5.3 M-7 -3.1 V3.1 M-3 -4.9 H2.2"/>'
      + '</g>'
      + '<path class="g" d="M1.9 .8 L-4.3 12 M1.9 .8 L8.1 12 M1.9 .8 V11.4"/>'
      + '<g transform="translate(-18 -17) scale(1.05)"><g class="spk">'
      +   '<path class="ray" d="M0 -8 C.5 -2 2 -.5 8 0 C2 .5 .5 2 0 8 C-.5 2 -2 .5 -8 0 C-2 -.5 -.5 -2 0 -8Z"/>'
      +   '<circle class="core" r="1.6"/>'
      + '</g></g>'
      + '</svg>';

    var scopeEl = document.createElement("button");
    scopeEl.type = "button"; scopeEl.id = "scope";
    scopeEl.innerHTML = SCOPE_SVG;
    deskEl.insertBefore(scopeEl, $("grid"));


    /* no visible label, but a screen reader still hears what it does */
    function scopeLabel(){
      if(!scopeEl) return;
      var s = ui(on ? "scopeDay" : "scopeNight");
      scopeEl.setAttribute("aria-label", s);
    }

    /* every way in goes through here: the telescope, the menu bar button,
       the N key and the context menu */
    function toggle(){ apply(on ? "day" : "night"); }

    /* called once the boot screen has gone; the star starts flaring then */
    function ready(){
      scopeLabel();
      scopeEl.classList.add("live");
    }

    scopeEl.addEventListener("click", toggle);
    scopeLabel();

    lbl.textContent = ui(on ? "dayB" : "nightB");
    btn.title = ui(on ? "dayT" : "nightT");
    /* the language switch repaints the words the night side owns */
    document.addEventListener("langchange", function(){
      lbl.textContent = ui(on ? "dayB" : "nightB");
      btn.title = ui(on ? "dayT" : "nightT");
      scopeLabel();
    });

    return { tick:tick, resize:resize, apply:apply, toggle:toggle, ready:ready,
             isOn:function(){ return on; } };
  })();

  /* ---------- context menu ---------- */
  var menuEl = $("menu"), menuFor = null;
  var MENUS = {
    desk: [ ["refresh","F5"], ["realign",""], ["sep"],
            ["readme",""], ["search","⌘K"], ["lang",""], ["sep"],
            ["closeall",""], ["night","N"], ["sep"],
            ["reset",""] ],
    ico:  [ ["open","↵"], ["orbit",""], ["sep"],
            ["search","⌘K"] ]
  };
  function hideMenu(){ menuEl.classList.remove("on"); menuFor = null; selectOnly(null); }
  function showMenu(kind, x, y, id){
    menuFor = id || null;
    menuEl.innerHTML = MENUS[kind].map(function(r){
      return r[0]==="sep" ? "<hr>"
        : '<button data-a="'+r[0]+'">'+ui("m_"+r[0])+(r[1]?'<s>'+r[1]+'</s>':'')+'</button>';
    }).join("");
    menuEl.classList.add("on");
    menuEl.style.left = "0px"; menuEl.style.top = "0px";
    var b = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, innerWidth - b.width - 8)+"px";
    menuEl.style.top  = Math.min(y, innerHeight - b.height - 8)+"px";
  }
  deskEl.addEventListener("contextmenu", function(e){
    if(MOB || e.target.closest(".win")) return;
    e.preventDefault();
    var ic = e.target.closest(".ico");
    if(ic){ selectOnly(ic); showMenu("ico", e.clientX, e.clientY, ic.getAttribute("data-app")); }
    else if(e.target.closest(".planet")){
      selectOnly(null);
      showMenu("ico", e.clientX, e.clientY, "readme");
    }
    else { selectOnly(null); showMenu("desk", e.clientX, e.clientY, null); }
  });
  menuEl.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    var a = b.getAttribute("data-a"), id = menuFor;
    hideMenu();
    if(a==="refresh"){ measureSky(); bloom(); }
    else if(a==="realign"){ glide(function(){ tNow = 0; }, 820, 34); }
    else if(a==="readme"){ launch("readme"); }
    else if(a==="search"){ palOpen(); }
    else if(a==="lang"){ setLang(LANG==="tr" ? "en" : "tr"); }
    else if(a==="open"){ if(id) launch(id); }
    else if(a==="orbit"){ if(id && byId[id]) glide(null, 700); }
    else if(a==="closeall"){ Object.keys(open).forEach(close); }
    else if(a==="night"){ NIGHT.toggle(); }
    else if(a==="reset"){
      Object.keys(open).forEach(close);
      try{ localStorage.removeItem("desk_session"); }catch(_){}
      measureSky(); bloom(); setTimeout(function(){ launch("readme"); }, 340);
    }
  });
  addEventListener("pointerdown", function(e){
    if(menuEl.classList.contains("on") && !e.target.closest("#menu")) hideMenu();
  }, true);
  addEventListener("blur", hideMenu);
  addEventListener("keydown", function(e){ if(e.key==="Escape") hideMenu(); });
  addEventListener("contextmenu", function(e){
    if(!MOB && !e.target.closest(".win") && !e.target.closest("#desk") && !e.target.closest("#menu")){
      e.preventDefault(); showMenu("desk", e.clientX, e.clientY, null);
    }
  });

  /* ---------- command palette ---------- */
  var pal=$("pal"), palin=$("palin"), pallist=$("pallist"), palIdx=0, palRows=[];
  function palPaint(){
    var q = palin.value.trim().toLocaleLowerCase("tr");
    palRows = DESK.filter(function(id){
      return !q || (APPS_BY.tr[id].t+" "+APPS_BY.en[id].t).toLocaleLowerCase("tr").indexOf(q) >= 0;
    });
    if(palIdx >= palRows.length) palIdx = 0;
    pallist.innerHTML = palRows.map(function(id,i){
      return '<div class="'+(i===palIdx?"cur":"")+'" data-app="'+id+'">'+APPS[id].t
           + '<em>'+(open[id]?ui("open"):ui("win"))+'</em></div>';
    }).join("") || '<div style="color:var(--faint)">'+ui("none")+'</div>';
  }
  function palOpen(){ pal.classList.add("on"); palin.value=""; palIdx=0; palPaint(); palin.focus(); }
  function palClose(){ pal.classList.remove("on"); palin.blur(); }
  palin.addEventListener("input", function(){ palIdx=0; palPaint(); });
  palin.addEventListener("keydown", function(e){
    if(e.key==="ArrowDown"){ e.preventDefault(); palIdx=Math.min(palRows.length-1,palIdx+1); palPaint(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); palPaint(); }
    else if(e.key==="Enter"){ e.preventDefault(); if(palRows[palIdx]){ launch(palRows[palIdx]); palClose(); } }
    else if(e.key==="Escape"){ e.preventDefault(); palClose(); }
  });
  pallist.addEventListener("click", function(e){
    var r=e.target.closest("[data-app]"); if(!r) return;
    launch(r.getAttribute("data-app")); palClose();
  });
  pal.addEventListener("pointerdown", function(e){ if(e.target===pal) palClose(); });
  $("palbtn").addEventListener("click", palOpen);
  $("barpal").addEventListener("click", palOpen);

  addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); palOpen(); return; }
    if(e.key==="Escape" && !pal.classList.contains("on") && focused){ close(focused); return; }
    if(e.altKey && /^[1-9]$/.test(e.key)){
      var id = DESK[+e.key-1]; if(id){ e.preventDefault(); launch(id); }
    }
  });

  /* ---------- language switch ----------
     everything with words in it is repainted in place: open windows keep
     their position, size and scroll, only the text changes */
  function paintLang(){
    document.documentElement.lang = LANG;
    Array.prototype.forEach.call($("lgbtn").children, function(i){
      i.classList.toggle("on", i.getAttribute("data-l") === LANG);
    });
    $("capA").textContent = ui("projects");
    $("lblA").textContent = APPS.readme.t;
    $("coreA").setAttribute("aria-label", ui("openReadme"));
    $("barpal").textContent = ui("search");
    palin.setAttribute("placeholder", ui("find"));
    conLbl.textContent = ui("about");
    Array.prototype.forEach.call(iconsEl.children, function(el){
      el.lastElementChild.textContent = APPS[el.getAttribute("data-app")].t;
    });
  }
  function setLang(l){
    if(l === LANG || !APPS_BY[l]) return;
    LANG = l; APPS = APPS_BY[l];
    try{ history.replaceState(null, "", location.pathname + (l==="en" ? "?lang=en" : "") + location.hash); }catch(_){}
    paintLang();
    Object.keys(open).forEach(function(id){
      var el = open[id].el, bd = el.querySelector(".body"), top = bd.scrollTop;
      el.querySelector(".nm").textContent = APPS[id].t;
      bd.innerHTML = APPS[id].html; bd.scrollTop = top; mountDemos(el);
      el.querySelector(".mn").title = ui("mn");
      el.querySelector(".mx").title = ui("mx");
      el.querySelector(".x").title = ui("x");
    });
    paintTasks();
    if(pal.classList.contains("on")) palPaint();
    document.dispatchEvent(new Event("langchange"));
  }
  paintLang();
  $("lgbtn").addEventListener("click", function(){ setLang(LANG==="tr" ? "en" : "tr"); });

  /* ---------- clock ---------- */
  function tick(){
    var d = new Date();
    $("clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  tick(); setInterval(tick, 10000);

  /* ---------- boot ---------- */
  var bootEl = $("boot"), osEl = $("os"), booted = false;
  function start(){
    if(booted) return; booted = true;
    bootEl.classList.add("gone");
    osEl.classList.add("up");
    setTimeout(function(){ bootEl.style.display = "none"; }, 380);
    measure(); layoutIcons();
    NIGHT.resize();
    if(NIGHT.isOn()) NIGHT.apply("night");
    NIGHT.ready();
    if(!reduce) bloom();
    placeAll();
    restore();
  }
  requestAnimationFrame(frame);
  if(reduce){ start(); }
  else {
    ["b1","b2","b3","b4"].forEach(function(id,i){
      setTimeout(function(){ var el=$(id); if(el) el.classList.add("on"); }, 120 + i*330);
    });
    setTimeout(start, 2050);
    addEventListener("keydown", start, { once:true });
    bootEl.addEventListener("pointerdown", start, { once:true });
  }
})();
</script>
